# SentinelAI 웹(app) + PostgreSQL + Milvus(벡터 DB) + etcd(Milvus 메타데이터) — DB 비밀번호는 .env 의 SENTINELAI_DB_PASSWORD (없으면 개발용 기본값).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: ${SENTINELAI_DB_PASSWORD:-sentinelai-dev}
      POSTGRES_DB: sentinelai
      # 문자열 정렬을 바이트 순으로 맞춥니다.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sentinelai/db/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai -d sentinelai"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Milvus 메타데이터 저장소 — 내장 etcd 는 다시 뜰 때 리더를 뽑는 사이에 Milvus 가 읽다 죽어 따로 띄웁니다.
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: ["etcd", "--name", "milvus", "--data-dir", "/etcd",
              "--listen-client-urls", "http://0.0.0.0:2379", "--advertise-client-urls", "http://etcd:2379",
              "--quota-backend-bytes", "4294967296", "--auto-compaction-mode", "revision", "--auto-compaction-retention", "1000"]
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.3
    command: ["milvus", "run", "standalone"]
    # 저장소(MinIO)는 따로 띄우지 않고 볼륨에 둡니다.
    environment:
      ETCD_ENDPOINTS: etcd:2379
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    security_opt:
      - seccomp:unconfined
    ports:
      - "127.0.0.1:19530:19530"
    volumes:
      - milvus-store:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    restart: unless-stopped

  app:
    build: .
    image: sentinelai:0.6.0
    env_file: .env
    environment:
      SENTINELAI_DB_PATH: postgresql://sentinelai:${SENTINELAI_DB_PASSWORD:-sentinelai-dev}@postgres:5432/sentinelai
      SENTINELAI_RESULTS_DB_PATH: postgresql://sentinelai:${SENTINELAI_DB_PASSWORD:-sentinelai-dev}@postgres:5432/sentinelai
      SENTINELAI_MILVUS_URI: http://milvus:19530
    ports:
      - "${SENTINELAI_WEB_BIND:-127.0.0.1}:8000:8000"
    volumes:
      # 검토 대상 data/ 는 읽기만 합니다. 기준 문서는 PostgreSQL 에 있습니다.
      - ./data:/app/data:ro,z
    # 같은 컴퓨터의 Ollama 는 http://host.docker.internal:11434 로 닿습니다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  etcd-data:
  milvus-store:
