# 시험용 점검 대상 서버 2대 — 값은 targets.env (python -m sentinelai.dev targets 가 만듦)
x-target: &target
  build:
    context: ..
    dockerfile: testenv/Containerfile
  image: sentinel-target
  # 호스트의 127.0.0.1 로 이어 SentinelAI 를 밖에 열지 않고, NET_ADMIN 으로 ufw 를 실제로 켭니다.
  network_mode: "pasta:--map-host-loopback,169.254.1.2"
  cap_add: [NET_ADMIN, NET_RAW]

services:
  target-weak:
    <<: *target
    hostname: target-weak
    environment:
      PROFILE: weak
      SERVER: ${SERVER:?targets.env 에 SERVER 가 없습니다}
      KEY: ${KEY_WEAK:?targets.env 에 KEY_WEAK 가 없습니다}
      INTERVAL: ${INTERVAL:-1}

  target-strict:
    <<: *target
    hostname: target-strict
    environment:
      PROFILE: strict
      SERVER: ${SERVER:?targets.env 에 SERVER 가 없습니다}
      KEY: ${KEY_STRICT:?targets.env 에 KEY_STRICT 가 없습니다}
      INTERVAL: ${INTERVAL:-1}
