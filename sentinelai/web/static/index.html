<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentinelAI</title>
<link rel="icon" href="data:,">  <!-- 브라우저가 /favicon.ico 를 요청해 404 가 콘솔에 찍히는 것을 막습니다 -->
<!--
  단일 파일 대시보드. CSS · JS · 아이콘을 모두 인라인으로 둡니다 (외부망 차단 전제 — CDN · 웹폰트 금지).
  로그인한 역할에 따라 메뉴가 달라집니다 (일반사용자 · 중간관리자 · 최상급자 · 루트). 권한 신청 · 결재 · 회수는 /api/requests,
  정책 관리 · 로그 감시는 /api/results · /api/jobs 에서 옵니다.
-->
<style>
  :root {
    --accent: #EA002C;   /* SK쉴더스 CI — 강조 · 위험 */
    --sub: #FF7A00;      /* 보조 · 주의 */
    --ok: #2E7D5B;       /* 정상 */
    --ink: #111111;
    --ink-dim: #666666;
    --bg: #FFFFFF;
    --bg-soft: #F5F5F6;
    --line: #E4E4E7;
    --risk-tint: #FFF4F6;
    --warn-tint: #FFF6EE;
    --ok-tint: #EFF7F3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    height: 100vh; overflow: hidden;
    display: grid;
    grid-template-rows: 56px minmax(0, 1fr);
    grid-template-columns: 60px minmax(0, 1fr);
    background: var(--bg-soft);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", sans-serif;
    font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none;
          stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.sm { width: 15px; height: 15px; }

  /* ── 상단 바 (GNB) ─────────────────────── */
  .topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 18px;
    padding: 0 20px; background: var(--ink); color: #fff;
  }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; letter-spacing: -0.3px; }
  .logo svg { width: 24px; height: 24px; stroke: var(--accent); stroke-width: 2.2; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  /* 엔진 경고 — CI 컬러는 흰 바탕에서만 쓰므로 검은 바 위에 흰 알약으로 띄웁니다 */
  .engine-warn {
    display: flex; align-items: center; padding: 5px 11px; border-radius: 7px;
    background: #fff; color: var(--accent); font-size: 12.5px; font-weight: 700; white-space: nowrap;
  }
  .engine-warn[hidden] { display: none; }
  .bell { position: relative; background: none; border: none; color: #fff; padding: 6px; margin-left: 6px; border-radius: 7px; }
  .bell:hover { background: #262626; }
  .bell .count {
    position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 99px; background: var(--accent); font-size: 10.5px; font-weight: 700;
    display: none; align-items: center; justify-content: center;
  }
  .bell .count.show { display: flex; }
  .alert-pop {
    position: absolute; top: 50px; right: 16px; width: 330px; z-index: 30;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.14); padding: 14px; display: none;
  }
  .alert-pop.show { display: block; }
  .alert-pop h4 { margin: 0 0 8px; font-size: 13px; }
  .alert-pop .none { margin: 0; font-size: 12.5px; color: var(--ink-dim); }
  .alert-pop .risk-item { font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .alert-pop .risk-item:hover { color: var(--accent); }

  /* ── 좌측 사이드바 ─────────────────────── */
  body.solo { grid-template-columns: minmax(0, 1fr); }
  body.solo .sidebar { display: none; }
  .sidebar {
    grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 0; background: var(--bg); border-right: 1px solid var(--line);
  }
  .nav {
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 9px; background: none; color: var(--ink-dim);
  }
  .nav:hover { background: var(--bg-soft); color: var(--ink); }
  .nav[aria-current="true"] { background: var(--risk-tint); color: var(--accent); }

  /* ── 검색 — 대기열만 거르므로 대기열 카드 제목 줄에 둡니다 ── */
  .search {
    flex: 1 1 220px; max-width: 320px; margin-left: auto; display: flex; align-items: center; gap: 8px;
    padding: 0 11px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    color: var(--ink-dim); font-size: 13px;
  }
  .search:focus-within { border-color: var(--ink); }
  .search input { flex: 1; border: none; outline: none; font: inherit; color: var(--ink); background: none; }

  /* ── 작업 영역 ─────────────────────────── */
  .workspace {
    display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 18px;
    padding: 18px 22px 22px; min-height: 0;
  }
  .main-col { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; }
  .main-col > * { flex-shrink: 0; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
  /* 정책 질의 탭은 질의를 넓게 쓰고, 근거 칩을 눌렀을 때만 오른쪽에 인용 조항 패널을 엽니다 */
  .workspace[data-tab="ask"]:not(.cite) { grid-template-columns: minmax(0, 1fr); }
  .workspace[data-tab="ask"]:not(.cite) > .panel { display: none; }
  .workspace[data-tab="ask"] .drawer-close { display: block; }

  /* 요약 지표 (제안서 ①) — 누르면 그 등급만 보는 필터 */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .stat { padding: 14px 16px; width: 100%; text-align: left; }
  .stat:hover { border-color: var(--ink-dim); }
  .stat.정상[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-tint); }
  .stat.주의[aria-pressed="true"] { border-color: var(--sub); background: var(--warn-tint); }
  .stat.위험[aria-pressed="true"] { border-color: var(--accent); background: var(--risk-tint); }
  .stat .label { font-size: 12px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; }
  .stat .num { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .stat.정상 .num { color: var(--ok); } .stat.주의 .num { color: var(--sub); } .stat.위험 .num { color: var(--accent); }

  /* 분석 큐 */
  .queue { display: flex; flex-direction: column; min-height: 320px; }
  .queue-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; flex-wrap: wrap; }
  .queue-head h3 { margin: 0; font-size: 15.5px; font-weight: 700; }
  /* 넓은 화면에서는 좌측 사이드바가 같은 필터를 맡으므로, 사이드바가 사라지는 작은 화면에서만 보입니다 */
  .seg { display: none; padding: 3px; background: var(--bg-soft); border-radius: 8px; }
  .seg button { border: none; background: none; padding: 5px 12px; border-radius: 6px; font-size: 12.5px; color: var(--ink-dim); font-weight: 600; }
  .seg button[aria-selected="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .table { border-top: 1px solid var(--line); }
  .tr {
    display: grid; align-items: center; gap: 12px;
    grid-template-columns: 84px minmax(200px, 1.4fr) minmax(160px, 1.3fr) 92px 112px 16px;
    padding: 0 18px;
  }
  .thead { height: 38px; font-size: 12px; color: var(--ink-dim); font-weight: 600; border-bottom: 1px solid var(--line); }
  .row {
    width: 100%; text-align: left; min-height: 56px; padding-top: 8px; padding-bottom: 8px; background: var(--bg);
    border: none; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; padding-left: 15px;
  }
  .row:hover { background: #FAFAFB; }
  .row[aria-current="true"] { background: var(--risk-tint); border-left-color: var(--accent); }
  .cell-type { font-size: 12.5px; color: var(--ink-dim); }
  .cell-type small { display: block; font-size: 11px; color: #999; font-variant-numeric: tabular-nums; }
  .who { min-width: 0; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .detail-cell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #333; }
  .time { font-size: 12.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .judge { display: flex; flex-direction: column; gap: 1px; font-size: 13px; font-weight: 600; }
  .judge .line { display: flex; align-items: center; gap: 5px; }
  .judge .op { font-size: 11px; font-weight: 500; color: var(--ink-dim); }
  .chev { color: #BBB; }
  /* 등급 점 — 같은 색을 옅게 깐 링 */
  .ldot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; vertical-align: 1px; margin-right: 6px; }
  .ldot.정상 { background: var(--ok); box-shadow: 0 0 0 3px rgba(46, 125, 91, .26); }
  .ldot.주의 { background: var(--sub); box-shadow: 0 0 0 3px rgba(255, 122, 0, .26); }
  .ldot.위험 { background: var(--accent); box-shadow: 0 0 0 3px rgba(234, 0, 44, .22); }
  .stat .label .ldot { margin-right: 0; }
  .lv-정상 { color: var(--ok); } .lv-주의 { color: var(--sub); } .lv-위험 { color: var(--accent); }
  .empty { padding: 36px 18px; text-align: center; color: var(--ink-dim); }

  /* 메인 탭 — 분석 대기열 · 통계 대시보드 · 권한 질의 */
  .main-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .main-tabs[hidden], .main-tab[hidden] { display: none; }
  .main-tab {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 14px; margin-bottom: -1px; border: none; border-bottom: 2px solid transparent;
    background: none; font-size: 14px; font-weight: 700; color: var(--ink-dim);
  }
  .main-tab:hover { color: var(--ink); }
  .main-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .view-queue { display: flex; flex-direction: column; gap: 14px; }
  /* display 를 지정한 요소는 hidden 속성만으로 숨겨지지 않아 직접 끕니다. */
  .view-queue[hidden], .ask[hidden] { display: none; }

  /* 통계 대시보드 */

  /* 권한 질의 — 남은 세로 공간을 채우고 기록만 안에서 스크롤합니다 */
  .ask { flex: 1 0 0; min-height: 380px; display: flex; flex-direction: column; }
  .ask-log { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 20px; }
  .qa { display: flex; flex-direction: column; gap: 8px; }
  .qa-q { display: flex; align-items: flex-start; gap: 8px; margin: 0; font-weight: 700; }
  .qa-q .no { flex: none; font-size: 11.5px; font-weight: 600; color: var(--ink-dim); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .qa .box { white-space: pre-wrap; }
  .qa .box.wait { color: var(--ink-dim); }
  .qa .box.fail { color: var(--sub); background: var(--warn-tint); }
  .qa .sec { margin-top: 2px; }
  .qa .chips { flex-direction: row; flex-wrap: wrap; }
  .qa .chip { width: auto; }
  .ask-foot { display: flex; flex-direction: column; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--line); }
  .ask-ex { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .ask-ex .label { font-size: 11.5px; font-weight: 600; color: var(--ink-dim); margin-right: 2px; }
  .ask-ex button {
    padding: 4px 12px; border: 1px solid var(--line); border-radius: 99px;
    background: var(--bg); color: var(--ink-dim); font-size: 12px; text-align: left;
  }
  .ask-ex button:hover { border-color: var(--ink-dim); color: var(--ink); }
  .ask-ex button:disabled { opacity: .5; cursor: progress; border-color: var(--line); color: var(--ink-dim); }
  .ask-form { display: flex; gap: 8px; }
  .ask-form input {
    flex: 1; min-width: 0; height: 40px; padding: 0 12px; outline: none;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit;
  }
  .ask-form input:focus { border-color: var(--ink); }
  .ask-form button { flex: none; height: 40px; padding: 0 20px; border: none; border-radius: 8px; background: var(--ink); color: #fff; font-weight: 700; }
  .ask-form button:disabled { background: var(--bg-soft); color: var(--ink-dim); cursor: progress; }
  .ask-foot .note { margin: 0; }

  /* ── 우측 패널 ─────────────────────────── */
  .panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .panel-head h3 { margin: 0; font-size: 15.5px; font-weight: 700; }
  .drawer-close { display: none; margin-left: auto; padding: 0 4px; border: none; background: none; font-size: 22px; line-height: 1; color: var(--ink-dim); }
  .drawer-close:hover { color: var(--ink); }
  .rerun ~ .drawer-close { margin-left: 4px; }
  .drawer-back { display: none; }
  .rerun {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg);
    font-size: 12.5px; font-weight: 600;
  }
  .rerun:hover { border-color: var(--ink-dim); }
  .rerun:disabled { color: var(--ink-dim); background: var(--bg-soft); cursor: progress; }
  .panel-body { flex: 1; overflow: auto; padding: 16px 18px; }
  .subject { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .rec-line { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
  .rec-line svg { width: 20px; height: 20px; }
  .meta { font-size: 12px; color: var(--ink-dim); margin: 4px 0 2px; }
  .sec { margin-top: 18px; }
  .sec h4 { margin: 0 0 7px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .box { background: var(--bg-soft); border-radius: 8px; padding: 11px 13px; font-size: 13.5px; }
  .kv { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .kv th, .kv td { text-align: left; padding: 4px 0; vertical-align: top; }
  .kv th { color: var(--ink-dim); font-weight: 600; width: 36%; padding-right: 10px; white-space: nowrap; }
  .chips { display: flex; flex-direction: column; gap: 6px; }
  .chip {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
    padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); font-size: 12.5px;
  }
  .chip:hover { border-color: var(--ink-dim); }
  .chip[aria-expanded="true"], .chip[aria-pressed="true"] { border-color: var(--sub); background: var(--warn-tint); }
  .chip .open { margin-left: auto; color: var(--ink-dim); font-size: 11px; white-space: nowrap; }
  .clause {
    margin: -2px 0 4px; padding: 10px 12px; border-left: 3px solid var(--sub);
    background: var(--bg-soft); border-radius: 0 6px 6px 0; font-size: 12.5px; white-space: pre-wrap;
  }
  .note { font-size: 11.5px; color: var(--ink-dim); margin: 6px 0 0; }

  .panel-foot { padding: 14px 18px 16px; border-top: 1px solid var(--line); background: var(--bg); }
  .panel-foot h4 { margin: 0 0 9px; font-size: 12.5px; font-weight: 700; }
  .decide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .decide button {
    height: 40px; border-radius: 8px; font-weight: 700; font-size: 13.5px; border: 1px solid;
  }
  .decide .approve { color: var(--ok); border-color: #9CCDB5; background: var(--ok-tint); }
  .decide .cond { color: #B85600; border-color: #FFC999; background: var(--warn-tint); }
  .decide .reject { color: #fff; border-color: var(--accent); background: var(--accent); }
  .decide button:hover { filter: brightness(0.97); }
  .decide button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
  .decision-state { font-size: 12px; margin-top: 8px; color: var(--ink-dim); display: flex; gap: 8px; align-items: center; }
  .decision-state b { color: var(--ink); }
  .decision-state button { border: none; background: none; padding: 0; color: var(--ink-dim); text-decoration: underline; font-size: 12px; }

  /* 기준 문서 보기 */
  .modal-back { position: fixed; inset: 0; background: rgba(17,17,17,.4); display: none; z-index: 40; align-items: center; justify-content: center; padding: 16px; }
  .modal-back.show { display: flex; }
  .modal { width: min(820px, 100%); max-height: 86vh; overflow: auto; background: var(--bg); border-radius: 12px; padding: 20px 22px; }
  .modal h3 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; }
  .modal h3 button { margin-left: auto; border: none; background: none; font-size: 20px; color: var(--ink-dim); }
  .modal .doc { margin-bottom: 16px; }
  .modal .doc h4 { margin: 0 0 6px; font-size: 13px; }
  .modal pre { margin: 0; white-space: pre-wrap; font: inherit; font-size: 13px; background: var(--bg-soft); border-radius: 8px; padding: 12px 14px; }

  /* 툴팁 */
  .tip {
    position: fixed; z-index: 60; max-width: 270px; pointer-events: none;
    background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 11px;
    font-size: 12px; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    word-break: keep-all; overflow-wrap: anywhere;
    opacity: 0; transform: translateY(3px); transition: opacity .12s ease, transform .12s ease;
  }
  .tip.show { opacity: 1; transform: none; }
  .tip[data-pos="right"] { transform: translateX(-3px); }
  .tip[data-pos="right"].show { transform: none; }
  .tip b { display: block; font-size: 12.5px; font-weight: 700; }
  .tip span { display: block; color: #CFCFCF; margin-top: 2px; }
  .tip b + span { margin-top: 3px; }
  [data-tip] { cursor: help; }
  button[data-tip], .row [data-tip] { cursor: pointer; }

  footer.foot { font-size: 11.5px; color: var(--ink-dim); padding: 2px 4px; }
  .queue-head .run { margin-left: auto; }
  .queue-head .run + .run { margin-left: 0; }
  .run[hidden], .stats[hidden], .req-form[hidden], .select[hidden], .nav[hidden], .seg[hidden] { display: none; }
  .nav-views { display: flex; flex-direction: column; gap: 6px; }

  /* 로그인한 사람 · 로그아웃 — 검은 바 위라 흰 글자 */
  .whoami { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #DDD; }
  .whoami[hidden] { display: none; }
  .top-btn { border: 1px solid #3A3A3A; background: none; color: #DDD; border-radius: 7px; padding: 4px 10px; font-size: 12px; }
  .top-btn:hover { border-color: #888; color: #fff; }

  /* 입력 양식 */
  .select { height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: inherit; font-size: 13px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; padding: 4px 18px 16px; }
  .form-grid .wide { grid-column: 1 / -1; }
  .form-grid label, .gate-card label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); }
  .form-grid label b { color: var(--accent); }
  .form-grid label input, .form-grid label textarea, .form-grid label select, .gate-card label input, .panel-foot textarea, .panel-foot input {
    font: inherit; font-size: 13.5px; color: var(--ink); font-weight: 400; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); outline: none; width: 100%;
  }
  .form-grid label :is(input, textarea, select):focus, .gate-card label input:focus, .panel-foot :is(textarea, input):focus { border-color: var(--ink); }
  .form-grid label :is(input, select):disabled { background: var(--bg-soft); color: var(--ink-dim); }
  .form-grid label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; }
  .check input { width: auto; }
  .form-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .form-actions button, .panel-actions button {

const CRITERIA_LABEL = { user: "사용자", department: "부서", solution: "솔루션", where: "위치", how: "행위", keyword: "항목", since: "부터", until: "까지" };
// 화면에는 등급 단어만 쓰고, 등급에서 나오는 권고 문구와 기준은 툴팁에만 둡니다.
const LEVEL_TIP = {
  "정상": "승인 권고|기준 문서에 부합 — AI가 승인을 권고합니다",
  "주의": "추가 검토|직무 연관성은 있으나 범위가 필요 이상 — 운영자 추가 검토 (기준 4.3)",
  "위험": "반려 권고|직무 무관 · 필수 승인 누락 · 장기 미사용 관리자 권한 (기준 4.2)",
};

const EMPTY_RESULTS = { summary: { failed: 0 }, sections: {}, policies: [], events: [], policy_review: null, generated_at: null };

const state = {
  me: null,             // /api/auth/me — 로그인한 사람
  results: EMPTY_RESULTS,
  requests: [],         // 결재자: 모든 신청 (유효 권한도 여기서 거릅니다)
  mine: [],             // 일반사용자: 내 신청
  users: [],            // 최상급자: 계정
  regulations: [],
  health: null,
  mainTab: "queue",     // queue | ask
  view: null,
  filter: "전체",
  stageFilter: "pending",
  query: "",
  selected: null,       // 큐 항목 key
  expanded: new Set(),  // 펼친 근거 칩
  panelMsg: "",         // 패널 동작 결과 (오류 · 완료)
  jobs: null,           // /api/jobs — 돌고 있는 분석 작업
  asks: { policy: [], log: [] },   // 내 질의 기록 — 로그인할 때 AI 결과 DB에서 받고, 새 질의는 서버가 남깁니다
  askSource: null,      // 패널에 띄운 인용 조항 { i: 질의 순번, n: sources 순번 }
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ── 데이터 로드 ─────────────────────────── */
// 세션이 끊기면(401) 어느 요청에서든 로그인 화면으로 돌아갑니다. 오류 문장은 서버가 준 것을 그대로 씁니다.
async function getJSON(url, opts) {
  const res = await fetch(url, { cache: "no-store", ...opts });
  if (res.status === 401 && url !== "/api/auth/login") {
    showLogin();
    throw new Error("로그인이 필요합니다");
  }
  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    try {
      const body = await res.json();
      msg = typeof body.detail === "string" ? body.detail : "입력값을 확인하세요";
    } catch (e) { /* 본문이 JSON 이 아니면 상태 코드만 */ }
    throw new Error(msg);
  }
  return res.json();
}

const send = (url, body, method = "POST") =>
  getJSON(url, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });

async function loadData() {
  const views = roleViews();
  const tasks = [];
  if (state.me.role !== "user") tasks.push(getJSON("/api/health").then((d) => { state.health = d; }).catch(() => { state.health = null; }));
  if (views.includes("requests")) tasks.push(getJSON("/api/requests").then((d) => { state.requests = d; }));
  if (views.includes("mine")) tasks.push(getJSON("/api/requests?mine=true").then((d) => { state.mine = d; }));
  if (views.includes("users")) tasks.push(getJSON("/api/users").then((d) => { state.users = d; }));
  if (views.some((v) => RESULT_VIEWS.has(v))) {
    tasks.push(getJSON("/api/results").then((d) => { state.results = d; }));
    tasks.push(getJSON("/api/jobs").then((d) => { state.jobs = d; }).catch(() => { state.jobs = null; }));
  }
  if (state.me.role !== "user") {
    tasks.push(getJSON("/api/regulations").then((d) => { state.regulations = d; }).catch(() => { state.regulations = []; }));
  }
  await Promise.all(tasks);
}

/* ── 큐 항목 — 메뉴마다 다른 데이터를 한 목록 형식으로 ─────── */
function findings() { return state.results.events || []; }
const stamp = (iso) => (iso ? new Date(iso).toLocaleString("sv-SE", { hour12: false }).slice(0, 16) : "");
function issues() { return (state.results.policy_review && state.results.policy_review.issues) || []; }
const period = (r) => (r.period_start || r.period_end ? `${r.period_start || "…"} ~ ${r.period_end || "…"}` : "기간 없음");
const requester = (r) => `${r.requester_department} ${r.requester_name}`.trim();

// 권한 DB의 active_grants 뷰와 같은 조건입니다 — 승인됐고 사용 기간이 끝나지 않은 신청.
const today = () => new Date().toLocaleDateString("sv-SE");
const isActive = (r) => r.stage === "approved" && (!r.period_end || r.period_end >= today());

function requestItem(r) {
  const v = r.ai_verdict;
  const level = v && !v.failed ? v.level : undefined;
  return {
    type: "req", key: `req:${r.request_no}`, id: r.request_no, level,
    who: requester(r),
    what: r.requested_access,
    when: stamp(r.submitted_at),
    judge: level || (r.judging ? "판정 중" : v && v.failed ? "판정 실패" : "판정 대기"),
    sub: r.stage === "approved" && !isActive(r) ? "승인 · 기간 끝" : STAGE_LABEL[r.stage], raw: r,
  };
}

// 정책 · 로그 결정은 권한 DB에 남고 /api/results 의 decisions 로 함께 옵니다.
const decisionOf = (kind, key) => ((state.results.decisions || {})[kind] || {})[key];

function queue() {
  const pol = issues().map((i, n) => ({
    type: "policy", key: `policy:${i.key}`, itemKey: i.key, id: `ISSUE-${n + 1}`, level: i.level,
    decision: decisionOf("policy", i.key),
    who: (i.policy_ids || []).join(" ↔ "),
    what: `${i.kind} — ${i.reason}`,
    when: stamp(state.results.sections && state.results.sections.policies && state.results.sections.policies.generated_at),
    judge: i.level, raw: i,
  }));
  const log = findings().map((f) => {
    const lines = ((f.detail && f.detail.events) || "").split("\n").filter(Boolean);
    return {
      type: "event", key: `event:${f.key}`, itemKey: f.key, id: `LOG-${f.id.split("@")[0]}`, level: f.level,
      decision: decisionOf("event", f.key),
      who: f.title,
      what: `로그 ${lines.length}건 — ${f.reason}`,
      when: stamp(f.detail && f.detail.last_event_at),
      judge: f.level, raw: f,
    };
  });
  const mine = state.mine.map((r) => ({
    type: "mine", key: `mine:${r.request_no}`, id: "", typeLabel: r.request_no,
    who: r.requested_access, what: r.reason || "—", when: stamp(r.submitted_at),
    judge: STAGE_LABEL[r.stage], raw: r,
  }));
  const users = state.users.map((u) => ({
    type: "user", key: `user:${u.id}`, id: u.login_id, typeLabel: ROLE_LABEL[u.role] + (u.is_root ? " · 루트" : ""),
    who: `${u.display_name} (${u.login_id})`, what: u.department || "부서 없음", when: stamp(u.last_login_at) || "—",
    judge: !u.is_active ? "정지" : u.locked_until && new Date(u.locked_until) > new Date() ? "잠김" : "활성",
    sub: u.must_change_password ? "비밀번호 변경 전" : "", raw: u,
  }));
  return [...state.requests.map(requestItem), ...mine, ...users, ...pol, ...log];
}

function inView(it) {
  if (TYPE_VIEW[it.type] !== state.view) return false;
  // 결재함은 기본으로 내 단계에서 기다리는 신청만 보여줍니다. 유효 권한(예전 권한 현황)도 같은 목록의 거르기입니다.
  if (it.type === "req" && state.stageFilter === "pending") return it.raw.stage === STEP[state.me.role];
  if (it.type === "req" && state.stageFilter === "active") return isActive(it.raw);
  return true;
}

function visible() {
  const q = state.query.trim().toLowerCase();
  return queue().filter((it) => {
    if (!inView(it)) return false;
    if (state.filter !== "전체" && it.level !== state.filter) return false;
    if (!q) return true;
    const hay = [it.id, it.who, it.what, it.judge, it.raw.reason, it.raw.recommendation,
                 ...(it.raw.policy_ids || [])].join(" ").toLowerCase();
    return hay.includes(q);
  });
}

// 종 배지: 내가 결재할 위험 신청 + 결정하지 않은 정책 · 로그 위험.
function openRisks() {
  if (!state.me || state.me.role === "user") return [];
  return queue().filter((it) => it.level === "위험" && (
    it.type === "req" ? it.raw.stage === STEP[state.me.role] : (it.type === "policy" || it.type === "event") && !it.decision));
}

/* ── 상단 바 ────────────────────────────── */
function engineProblems(h) {
  if (!h) return ["서버에서 엔진 상태를 받지 못했습니다"];
  const out = [];
  if (!h.connected) out.push("Ollama 서버 연결 끊김");
  else {
    if (!h.model_ready) out.push(`판정 모델 없음 (${h.model})`);
    if (!h.qa_model_ready) out.push(`질답 모델 없음 (${h.qa_model})`);
    if (!h.embedding_ready) out.push(`임베딩 모델 없음 (${h.embedding_model})`);
  }
  if (!h.index_ready) out.push("기준 문서 인덱스 비어 있음");
  return out;
}

function renderTop() {
  $("bell").hidden = state.me.role === "user";
  // 정상일 때는 아무것도 띄우지 않고, 문제가 있을 때만 경고 1개를 띄웁니다.
  // 일반사용자에게는 AI가 보이지 않으므로 엔진 경고도 띄우지 않습니다.
  const problems = state.me.role === "user" || (state.health && state.health.ok) ? [] : engineProblems(state.health);
  const warn = $("engine-warn");
  warn.hidden = !problems.length;
  warn.dataset.tip = `점검 항목|${problems.join(" · ")}. 저장된 판정 결과는 계속 볼 수 있습니다`;

    <h4>위험 알림 ${risks.length ? `— 미결 ${risks.length}건` : "— 미결 없음"}</h4>
    ${risks.length
      ? risks.map((it) => `<div class="risk-item" data-key="${esc(it.key)}"><i class="ldot 위험"></i>${esc(it.id)} · ${esc(it.who)}</div>`).join("")
      : `<p class="none">운영자 결정을 기다리는 위험 건이 없습니다.</p>`}`;

    $("alert-pop").classList.remove("show");

  }));
}

/* ── 지표 ───────────────────────────────── */
function renderStats() {
  // 숫자는 지금 보고 있는 메뉴를 따라 아래 목록과 맞춥니다. 등급이 없는 메뉴(내 신청 · 계정)는 카드를 숨깁니다.
  $("stats").hidden = !LEVEL_VIEWS.has(state.view);
  const items = queue().filter(inView);
  $("stats").innerHTML = LEVELS.map((l) =>
    `<button class="card stat ${l}" data-level="${l}" aria-pressed="${state.filter === l}" data-tip="${esc(LEVEL_TIP[l])}">
      <span class="label"><i class="ldot ${l}"></i>${l}</span>
      <span class="num">${items.filter((it) => it.level === l).length}</span></button>`
  ).join("");

  // 넓은 화면에는 세그먼트가 없으므로 건수를 사이드바 툴팁 제목에 붙입니다.
  document.querySelectorAll(".nav[data-view]").forEach((b) => {
    const [title, desc] = VIEWS[b.dataset.view].tip.split("|");
    b.dataset.tip = `${title} — ${n[b.dataset.view]}건|${desc}`;

/* ── 분석 큐 ────────────────────────────── */
function emptyText() {
  if (queue().some(inView)) return "조건에 맞는 항목이 없습니다.";
  if (RESULT_VIEWS.has(state.view)) return `아직 ${VIEWS[state.view].label} 결과가 없습니다. 오른쪽 위 [${runKindLabel()}]을 누르세요.`;
  return {
    requests: { pending: "지금 결재할 신청이 없습니다.", active: "지금 유효한 권한이 없습니다.", all: "신청이 없습니다." }[state.stageFilter],
    mine: "아직 신청한 권한이 없습니다. 위 신청서를 채워 신청하세요.",
    users: "계정이 없습니다.",
  }[state.view];
}

function renderRows() {
  $("thead").innerHTML = VIEWS[state.view].cols.map((c) => `<span>${esc(c)}</span>`).join("") + "<span></span>";
  const items = visible();

    return `<button class="tr row" data-key="${esc(it.key)}" aria-current="${it.key === state.selected}">
      <span class="cell-type">${esc(it.typeLabel || TYPE_LABEL[it.type])}<small>${esc(it.id)}</small></span>
      <span class="who">${esc(it.who)}</span>
      <span class="detail-cell" data-tip="${esc(it.what)}">${esc(it.what)}</span>
      <span class="time">${esc(it.when)}</span>
      <span class="judge">${judge}${sub ? `<span class="op">${esc(sub)}</span>` : ""}</span>
      <span class="chev">${icon("chev", "sm")}</span>

function select(key) {
  if (state.selected !== key) state.panelMsg = "";
  state.selected = key;
  setMainTab("queue");
  const it = queue().find((i) => i.key === key);
  if (it && TYPE_VIEW[it.type] !== state.view) setView(TYPE_VIEW[it.type]);
  renderRows();
  renderPanel();
  openDrawer();
}

/* ── 근거 조항 전문 ─────────────────────── */
function docOf(source) { return state.regulations.find((r) => source.includes(r.name)); }

// 솔루션 정책 규칙 근거는 "rules:policies.csv (DLP-001, FW-001)" 처럼 옵니다. 언급된 정책 ID 의 원본 행을 보여줍니다.
// 모델이 ID 에 줄바꿈 없는 하이픈(FW‑002, U+2011) 같은 변형 문자를 쓰기도 해서 맞춰 비교합니다.
const plainDash = (s) => String(s).replace(/[\u2010-\u2015\u2212]/g, "-");
const isRule = (source) => /rules:/.test(source);
const ruleIds = (source) => (state.results.policies || []).map((p) => p.policy_id).filter((id) => plainDash(source).includes(id));
function ruleText(source) {
  const rows = state.results.policies || [];
  const ids = ruleIds(source);
  const hit = rows.filter((p) => ids.includes(p.policy_id));
  const shown = hit.length ? hit : rows;
  if (!shown.length) return "정책 관리 검토를 돌리면 솔루션 정책 원본이 여기에 표시됩니다.";
  return shown.map((p) => `${p.policy_id} [${p.solution}] ${p.source} → ${p.destination} · ${p.service} · ${p.action} · 만료 ${p.expires_at || "없음"}`).join("\n");
}

function clauseText(source) {
  if (isRule(source)) return ruleText(source);
  const doc = docOf(source);
  if (!doc) return "기준 문서 원문에서 이 근거를 찾을 수 없습니다.";
  // 모델이 "[...md] 4.1, 4.2, 4.3" 처럼 여러 조항을 한 줄로 돌려주므로 전부 찾습니다.
  const nums = [...new Set(source.match(/\d+\.\d+/g) || [])];
  const lines = doc.content.split("\n");
  const heading = (i) => /^#{2,4}\s/.test(lines[i]);
  const blocks = nums.map((num) => {
    const start = lines.findIndex((l, i) => heading(i) && l.includes(num));
    if (start < 0) return null;
    let end = start + 1;
    while (end < lines.length && !heading(end)) end++;
    return lines.slice(start, end).join("\n").trim();
  }).filter(Boolean);
  if (!blocks.length) return doc.content.trim();   // 조항 번호가 없으면 문서 전문
  return `${doc.name}\n\n` + blocks.join("\n\n");
}

function chipLabel(source) {
  if (isRule(source)) {
    const ids = ruleIds(source);
    return `솔루션 정책${ids.length ? ` · ${ids.join(", ")}` : ""}`;
  }
  const doc = docOf(source);
  const nums = [...new Set(source.match(/\d+\.\d+/g) || [])];
  const name = doc ? doc.name.replace(/\.md$/, "") : String(source).replace(/[\[\]#]/g, "").trim();
  return nums.length ? `${name} · ${nums.join(", ")}` : name;
}

/* ── 우측 패널 ──────────────────────────── */
function renderPanel() {
  if (state.mainTab === "ask") { renderAskPanel(); return; }
  const it = queue().find((i) => i.key === state.selected);
  const panel = $("panel");
  if (state.view === "users" && (!it || it.type !== "user")) { renderUserPanel(null); return; }
  if (it && (it.type === "req" || it.type === "mine")) { renderRequestPanel(it); return; }
  if (it && it.type === "user") { renderUserPanel(it.raw); return; }
  if (!it) {
    // 빈 패널도 메뉴를 따릅니다. 일반사용자에게는 AI 문구를 보이지 않습니다.
    const [title, text] = {
      mine: ["내 신청", "신청하거나 목록에서 신청을 고르면<br>결재 상태와 기록이 표시됩니다."],
      requests: ["권한 신청 검토", "목록에서 신청을 선택하면<br>신청 내용 · AI 판정 · 결재 기록이 표시됩니다."],
    }[state.view] || ["AI 판단 근거", "목록에서 항목을 선택하면<br>AI 판단 근거와 권고가 표시됩니다."];
    panel.innerHTML = `<div class="panel-head"><h3>${title}</h3>${CLOSE_BTN}</div>
      <div class="panel-body"><div class="empty">${text}</div></div>`;
    return;
  }
  const r = it.raw;
  const isEvent = it.type === "event";
  const decision = it.decision;

  const table = (state.results.policies || []).filter((p) => (r.policy_ids || []).includes(p.policy_id)).map((p) => [p.policy_id,
    `${p.solution} · ${p.source} → ${p.destination} · ${p.service} · ${p.action} · 만료 ${p.expires_at || "없음"}`]);

  panel.innerHTML = `
    <div class="panel-head">
      <h3>AI 판단 근거</h3>
      ${CLOSE_BTN}
    </div>
    <div class="panel-body">
      <p class="subject">${esc(it.type === "policy" ? `${it.who} · ${r.kind}` : r.title)}</p>
      <div class="rec-line lv-${it.level}">${icon(LEVEL_ICON[it.level] || "warn")}${esc(it.level)}</div>
      <div class="meta">${esc(it.id)}</div>

      <div class="sec"><h4>${icon("file", "sm")}${isEvent ? "판정한 로그" : "관련 정책 원본"}</h4>
        ${isEvent
          ? `<div class="box pre">${esc((r.detail && r.detail.events) || "로그 없음")}</div>`
          : `<div class="box"><table class="kv">
          ${table.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("") || "<tr><td>정보 없음</td></tr>"}
        </table></div>`}
      </div>

      <div class="sec"><h4>${icon("activity", "sm")}판단 이유</h4>
        <div class="box">${esc(r.reason)}</div>
      </div>

      <div class="sec"><h4>${icon("ok", "sm")}권고 조치</h4>
        <div class="box">${esc(r.recommendation)}</div>
      </div>

      <div class="sec"><h4>${icon("db", "sm")}근거 조항</h4>
        ${it.type !== "policy"
          ? sourceChips(it.key, r.sources)
          : `<p class="note">정책 관리 검토는 근거 조항을 판단 이유에 함께 적습니다. 적용 기준은 기준 문서 5 · 6장입니다.</p>`}
      </div>
      ${decisionLog(it)}
    </div>
    <div class="panel-foot">
      <h4>보안 운영자 의사결정</h4>
      <textarea id="review-comment" maxlength="2000" placeholder="결정 의견 (선택)"></textarea>
      <div class="decide">
        ${Object.entries(DECISION_SET[it.type]).map(([a, cls]) =>
          `<button class="${cls}" data-action="${a}" aria-pressed="${decision && decision.action === a}">${DECISIONS[a]}</button>`).join("")}
      </div>
      <div class="decision-state">${decision
        ? `<span>결정 <b>${esc(DECISIONS[decision.action])}</b> · ${esc(`${decision.decider_department} ${decision.decider_name}`.trim())} · ${esc(stamp(decision.decided_at))}${decision.ai_level ? ` (그때 AI 판정: ${esc(decision.ai_level)})` : ""}${decision.comment ? ` — ${esc(decision.comment)}` : ""}</span><button id="undo">취소</button>`
        : `<span>AI는 권고만 합니다. 최종 결정은 운영자가 내립니다.</span>`}</div>
      ${panelMsg()}
    </div>`;

  bindChips(panel);
  panel.querySelectorAll(".decide button").forEach((el) => el.addEventListener("click", () => reviewDecision(it, el.dataset.action)));
  const undo = $("undo");
  if (undo) undo.addEventListener("click", () => reviewDecision(it, "cancel"));
}

// 최상급자에게만 결정 기록 전부가 옵니다 (decision_log). 누가 어떤 판단을 했다가 취소했는지까지 읽습니다.
function decisionLog(it) {
  const log = state.results.decision_log;
  if (!log) return "";
  const rows = (log[it.type] || {})[it.itemKey] || [];
  const steps = rows.map((d) => `<div class="step"><b>${d.action === "cancel" ? "결정 취소" : esc(DECISIONS[d.action])}</b>
      · ${esc(d.decider_name)}${d.decider_department ? ` (${esc(d.decider_department)})` : ""}
      <span class="when">${esc(stamp(d.decided_at))}${d.ai_level ? ` · 그때 AI 판정 ${esc(d.ai_level)}` : ""}</span>
      ${d.comment ? `<span class="say">${esc(d.comment)}</span>` : ""}</div>`);
  return `<div class="sec"><h4>${icon("list", "sm")}결정 기록</h4>${steps.length
    ? `<div class="box history">${steps.join("")}</div>` : `<p class="note">아직 결정이 없습니다.</p>`}</div>`;
}

function sourceChips(key, sources) {
  if (!(sources || []).length) return `<p class="note">모델이 근거 문서를 반환하지 않았습니다.</p>`;
  return `<div class="chips">${sources.map((s, n) => {
    const k = `${key}#${n}`, open = state.expanded.has(k);
    return `<button class="chip" data-k="${esc(k)}" aria-expanded="${open}">${icon("file", "sm")}<span>${esc(chipLabel(s))}</span><span class="open">${open ? "접기" : "조항 전문"}</span></button>
      ${open ? `<div class="clause">${esc(clauseText(s))}</div>` : ""}`;
  }).join("")}</div>`;
}

function bindChips(panel) {
  panel.querySelectorAll(".chip[data-k]").forEach((el) => el.addEventListener("click", () => {
    const k = el.dataset.k;
    state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
    renderPanel();
  }));
}

const kvTable = (rows) => `<div class="box"><table class="kv">${rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table></div>`;
const panelMsg = () => (state.panelMsg ? `<p class="form-msg${state.panelMsg.startsWith("✓") ? " ok" : ""}">${esc(state.panelMsg)}</p>` : "");

/* ── 권한 신청 패널 — 결재자에게는 AI 판정과 결재 · 회수, 신청자에게는 상태와 철회 ── */
function renderRequestPanel(it) {
  const r = it.raw, me = state.me, applicant = me.role === "user";
  const v = r.ai_verdict;
  const canDecide = !applicant && r.stage === STEP[me.role];
  const canRevoke = !applicant && r.stage === "approved";
  const canWithdraw = applicant && r.stage === "manager";

  let ai = "";
  if (!applicant) {
    if (r.judging) ai = `<div class="sec"><h4>${icon("activity", "sm")}AI 판정</h4><div class="box">AI가 판정하고 있습니다… (수십 초)</div></div>`;
    else if (!v) ai = `<div class="sec"><h4>${icon("activity", "sm")}AI 판정</h4><div class="box">아직 판정이 없습니다.</div></div>`;
    else if (v.failed) ai = `<div class="sec"><h4>${icon("activity", "sm")}AI 판정</h4><div class="box warn">판정 실패 — ${esc(v.error || "원인 불명")}. 수동으로 검토하거나 다시 판정하세요.</div></div>`;
    else ai = `
      <div class="sec"><h4>${icon("activity", "sm")}AI 판단 이유</h4><div class="box">${esc(v.reason)}</div></div>
      <div class="sec"><h4>${icon("ok", "sm")}AI 권고</h4><div class="box">${esc(v.recommendation)}</div></div>
      <div class="sec"><h4>${icon("db", "sm")}근거 조항</h4>${sourceChips(it.key, v.sources)}</div>
      <p class="note">${esc(v.model)} · ${esc(stamp(v.judged_at))} 판정</p>`;
  }

  const steps = [
    ...r.approvals.map((a) => `<div class="step"><b>${a.step === "manager" ? "1차" : "최종"} ${a.action === "approve" ? "승인" : "반려"}</b>
      · ${esc(a.approver_name)}${a.approver_department ? ` (${esc(a.approver_department)})` : ""}
      <span class="when">${esc(stamp(a.decided_at))}${!applicant && a.ai_level ? ` · 그때 AI 판정 ${esc(a.ai_level)}` : ""}</span>
      ${a.comment ? `<span class="say">${esc(a.comment)}</span>` : ""}</div>`),
    ...(r.revocation ? [`<div class="step"><b>회수</b> · ${esc(r.revocation.revoker_name)}${r.revocation.revoker_department ? ` (${esc(r.revocation.revoker_department)})` : ""}
      <span class="when">${esc(stamp(r.revocation.revoked_at))}</span><span class="say">${esc(r.revocation.reason)}</span></div>`] : []),
  ];

  let foot;
  if (canDecide) {
    foot = `<h4>${me.role === "manager" ? "1차 결재" : "최종 결재"}</h4>
      <textarea id="decision-comment" maxlength="2000" placeholder="결재 의견 (선택)"></textarea>
      <div class="panel-actions"><button class="good" data-act="approve">승인</button><button class="danger" data-act="reject">반려</button></div>
      <p class="note">AI는 권고만 합니다. 결재는 지금 보이는 AI 판정과 함께 기록됩니다.</p>`;
  } else if (canRevoke) {
    foot = `<h4>권한 회수</h4>
      <input id="revoke-reason" maxlength="2000" placeholder="회수 사유 (필수)">
      <div class="panel-actions"><button class="danger" data-act="revoke">회수</button></div>`;
  } else if (canWithdraw) {
    foot = `<h4>신청 철회</h4><p class="note">1차 결재 전에만 철회할 수 있습니다. 반려 · 철회 뒤에는 새로 신청합니다.</p>
      <div class="panel-actions"><button data-act="withdraw">철회</button></div>`;
  } else {
    foot = `<h4>${esc(STAGE_LABEL[r.stage])}</h4><p class="note">${
      applicant ? "결재가 끝나거나 진행 중인 신청입니다."
      : r.stage === "manager" || r.stage === "top" ? `${STAGE_LABEL[r.stage]} — 내 결재 단계가 아닙니다.` : "더 할 결재가 없습니다."}</p>`;
  }

  const rows = [["신청자", requester(r)], ["신청 권한", r.requested_access], ["현재 보유 권한", r.current_access || "—"],
                ["신청 사유", r.reason || "—"], ["사용 기간", period(r)], ["신청 시각", stamp(r.submitted_at)], ["상태", STAGE_LABEL[r.stage]]];
  const rejudge = !applicant && !r.judging && r.stage === "manager";
  $("panel").innerHTML = `
    <div class="panel-head">
      <h3>${applicant ? "내 신청" : "권한 신청 검토"}</h3>
      ${rejudge ? `<button class="rerun" data-act="rejudge">${icon("activity", "sm")}다시 판정</button>` : ""}
      ${CLOSE_BTN}
    </div>
    <div class="panel-body">
      <p class="subject">${esc(r.requested_access)}</p>
      ${applicant ? "" : `<div class="rec-line ${it.level ? `lv-${it.level}` : ""}">${it.level ? icon(LEVEL_ICON[it.level]) : ""}${esc(it.judge)}</div>`}
      <div class="meta">${esc(r.request_no)} · ${esc(STAGE_LABEL[r.stage])}</div>
      <div class="sec"><h4>${icon("file", "sm")}신청 내용</h4>${kvTable(rows)}</div>
      ${ai}
      <div class="sec"><h4>${icon("list", "sm")}결재 기록</h4>${steps.length ? `<div class="box history">${steps.join("")}</div>` : `<p class="note">아직 결재가 없습니다.</p>`}</div>
    </div>
    <div class="panel-foot">${foot}${panelMsg()}</div>`;

  bindChips($("panel"));
  $("panel").querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => requestAction(r.request_no, b.dataset.act)));
}

async function reviewDecision(it, action) {
  try {
    const res = await send("/api/decisions", {
      kind: it.type, item_key: it.itemKey, action, ai_level: it.level || null,
      subject: it.type === "policy" ? `${it.who} · ${it.raw.kind}` : it.raw.title,
      comment: action === "cancel" ? "" : ($("review-comment") || {}).value || "",
    });
    const all = state.results.decisions || (state.results.decisions = {});
    const mine = all[it.type] || (all[it.type] = {});
    if (res.decision) mine[it.itemKey] = res.decision; else delete mine[it.itemKey];
    if (state.results.decision_log) state.results.decision_log = (await getJSON("/api/results")).decision_log;
    state.panelMsg = action === "cancel" ? "✓ 결정을 취소했습니다" : `✓ 기록했습니다 — ${DECISIONS[action]}`;
  } catch (e) {
    state.panelMsg = e.message;
  }
  renderAfterChange();
}

async function requestAction(no, act) {
  const base = `/api/requests/${encodeURIComponent(no)}`;
  try {
    if (act === "approve" || act === "reject") {
      if (act === "reject" && !confirm(`${no} 신청을 반려합니다. 반려하면 신청자는 새로 신청해야 합니다.`)) return;
      await send(`${base}/decision`, { action: act, comment: ($("decision-comment") || {}).value || "" });
      state.panelMsg = `✓ ${act === "approve" ? "승인" : "반려"}했습니다`;
    } else if (act === "revoke") {
      const reason = ($("revoke-reason") || {}).value || "";
      if (!reason.trim()) { state.panelMsg = "회수 사유를 적어 주세요"; renderPanel(); return; }
      if (!confirm(`${no} 권한을 회수합니다.`)) return;
      await send(`${base}/revoke`, { reason });
      state.panelMsg = "✓ 회수했습니다";
    } else if (act === "withdraw") {
      if (!confirm(`${no} 신청을 철회합니다.`)) return;
      await send(`${base}/withdraw`);
      state.panelMsg = "✓ 철회했습니다";
    } else if (act === "rejudge") {
      await send(`${base}/rejudge`);
      state.panelMsg = "";
    }
  } catch (e) {
    state.panelMsg = e.message;
  }
  await refreshRequests();
}

/* ── 계정 관리 패널 (최상급자) — 선택 없음 = 새 계정. 루트 계정은 루트만, 자기 역할 · 활성은 못 바꿈 ── */
function renderUserPanel(u) {
  const roleOptions = (sel, disabled) => `<select name="role" ${disabled ? "disabled" : ""}>${Object.entries(ROLE_LABEL)
    .map(([k, label]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${label}</option>`).join("")}</select>`;
  if (!u) {
    $("panel").innerHTML = `
      <div class="panel-head"><h3>새 계정</h3>${CLOSE_BTN}</div>
      <form class="panel-body form-grid" id="user-form" style="padding:16px 18px">
        <label>아이디<input name="login_id" required maxlength="100" autocomplete="off"></label>
        <label>이름<input name="display_name" required maxlength="100"></label>
        <label>부서<input name="department" maxlength="100"></label>
        <label>역할${roleOptions("user")}</label>
        <label class="wide">임시 비밀번호 (첫 로그인에 바꾸게 됩니다)<input name="password" type="password" required autocomplete="new-password"></label>
        <div class="wide form-actions">${panelMsg()}<button type="submit" class="primary">계정 만들기</button></div>
      </form>`;
    $("user-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      try {
        const made = await send("/api/users", body);
        state.panelMsg = `✓ ${made.login_id} 계정을 만들었습니다`;
        await refreshUsers(`user:${made.id}`);
      } catch (err) { state.panelMsg = err.message; renderPanel(); }
    });
    return;
  }
  // 루트 계정은 루트만 고칩니다. 자기 계정과 루트는 역할 · 활성을 바꿀 수 없습니다 (서버도 막습니다).
  const self = u.id === state.me.id;
  const locked = u.is_root && !state.me.is_root;
  const fixed = u.is_root || self;
  const note = locked ? "루트 계정은 루트만 고칠 수 있습니다."
    : u.is_root ? "루트는 역할을 바꾸거나 정지할 수 없습니다."
    : self ? "자기 계정의 역할을 바꾸거나 정지할 수 없습니다."
    : "계정은 지우지 않고 정지합니다 (결재 기록이 가리킵니다).";
  $("panel").innerHTML = `
    <div class="panel-head"><h3>계정</h3>${CLOSE_BTN}</div>
    <div class="panel-body">
      <p class="subject">${esc(u.display_name)} (${esc(u.login_id)})</p>
      <div class="meta">${esc(ROLE_LABEL[u.role])}${u.is_root ? " · 루트" : ""} · 만든 날 ${esc(stamp(u.created_at))}${u.last_login_at ? ` · 마지막 로그인 ${esc(stamp(u.last_login_at))}` : ""}</div>
      ${locked ? "" : `<form class="form-grid" id="user-edit" style="padding:12px 0 0">
        <label>이름<input name="display_name" value="${esc(u.display_name)}" maxlength="100"></label>
        <label>부서<input name="department" value="${esc(u.department)}" maxlength="100"></label>
        <label>역할${roleOptions(u.role, fixed)}</label>
        <label class="check"><input type="checkbox" name="is_active" ${u.is_active ? "checked" : ""} ${fixed ? "disabled" : ""}>활성 (끄면 정지 · 세션 끊김)</label>
        <div class="wide form-actions"><button type="submit" class="primary">저장</button></div>
      </form>
      <form class="form-grid" id="user-reset" style="padding:12px 0 0">
        <label class="wide">비밀번호 초기화 — 임시 비밀번호<input name="temporary_password" type="password" required autocomplete="new-password"></label>
        <div class="wide form-actions"><button type="submit">초기화</button></div>
      </form>`}
    </div>
    <div class="panel-foot">${panelMsg() || `<p class="note">${note}</p>`}</div>`;
  if (locked) return;
  $("user-edit").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = { display_name: f.display_name.value, department: f.department.value };
    if (!fixed) { body.role = f.role.value; body.is_active = f.is_active.checked; }
    try { await send(`/api/users/${u.id}`, body, "PATCH"); state.panelMsg = "✓ 저장했습니다"; }
    catch (err) { state.panelMsg = err.message; }
    await refreshUsers(`user:${u.id}`);
  });
  $("user-reset").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await send(`/api/users/${u.id}/reset-password`, { temporary_password: e.target.temporary_password.value });
      state.panelMsg = "✓ 초기화했습니다. 다음 로그인에 비밀번호를 바꾸게 됩니다";
    } catch (err) { state.panelMsg = err.message; }
    await refreshUsers(`user:${u.id}`);
  });
}

function renderAfterChange() {
  renderTop(); renderRows(); renderPanel();
}

/* ── 다시 받기 — 결재 · 회수 · 계정 변경 뒤, 그리고 AI 판정이 끝나기를 기다릴 때 ── */
async function refreshRequests() {
  const views = roleViews();
  try {
    await Promise.all([
      views.includes("requests") ? getJSON("/api/requests").then((d) => { state.requests = d; }) : null,
      views.includes("mine") ? getJSON("/api/requests?mine=true").then((d) => { state.mine = d; }) : null,
    ]);
  } catch (e) { return; }
  // 결재 · 회수로 목록에서 빠진 항목을 고르고 있었으면 같은 신청을 다른 메뉴에서 찾지 않고 그대로 비웁니다.
  if (!queue().some((i) => i.key === state.selected)) state.selected = null;
  renderTop(); renderStats(); renderRows(); renderPanel();
}

async function refreshUsers(selectKey) {
  try { state.users = await getJSON("/api/users"); } catch (e) { return; }
  state.selected = selectKey || state.selected;
  renderStats(); renderRows(); renderPanel();
}

// 판정 중인 신청이 있으면 끝날 때까지 3초마다 다시 받습니다. 입력 중인 결재 의견을 지우지 않게 패널은 판정이 끝난 그 항목일 때만 다시 그립니다.
setInterval(async () => {
  if (!state.me || state.me.role === "user") return;
  const judging = () => state.requests.filter((r) => r.judging).map((r) => r.request_no);
  const before = judging();
  if (!before.length) return;
  const sel = state.selected;
  try {
    state.requests = await getJSON("/api/requests");
  } catch (e) { return; }
  const after = new Set(judging());
  renderTop(); renderStats(); renderRows();
  if (sel && before.some((no) => sel.endsWith(`:${no}`) && !after.has(no))) renderPanel();
}, 3000);

/* ── 질의 — 정책 질의(Answer)도 로그 질의도 등급이 없으므로 등급 배지를 달지 않습니다 ── */
const askMode = () => (state.view === "events" ? "log" : "policy");
const asks = () => state.asks[askMode()];

function askWaitLabel(m) {
  return `답변 생성 중… ${Math.round((Date.now() - m.started) / 1000)}초`;
}

function renderAsk() {
  const log = $("ask-log");
  const mode = askMode(), cfg = ASK[mode], list = asks();
  $("tab-ask-label").textContent = cfg.label;
  $("ask-input").placeholder = cfg.placeholder;
  $("ask-note").textContent = cfg.note;
  const busy = list.some((m) => m.started);
  $("ask-send").disabled = busy;
  $("ask-ex").querySelectorAll("button").forEach((b) => { b.disabled = busy; });
  if (!list.length) {
    log.innerHTML = `<div class="empty">${esc(cfg.empty)}<br>답변에 수십 초 이상 걸릴 수 있습니다.</div>`;
    return;
  }
  log.innerHTML = list.map((m, i) => {
    let body;
    if (m.started) body = `<div class="box wait" id="ask-wait">${askWaitLabel(m)}</div>`;
    else if (m.failed) body = `<div class="box fail">${esc(m.answer)}</div>`;
    else body = `<div class="box">${esc(m.answer)}</div>`;
    const src = m.started || m.failed ? "" : mode === "log" ? logEvidence(m, i) : `
      <div class="sec"><h4>${icon("db", "sm")}근거 조항</h4>
        ${(m.sources || []).length
          ? `<div class="chips">${m.sources.map((s, n) => {
              const on = !!state.askSource && state.askSource.i === i && state.askSource.n === n;
              return `<button class="chip" data-src="${i}:${n}" aria-pressed="${on}" aria-controls="panel">${icon("file", "sm")}<span>${esc(chipLabel(s))}</span><span class="open">${on ? "표시 중" : "조항 전문"}</span></button>`;
            }).join("")}</div>`
          : `<p class="note">모델이 근거 문서를 반환하지 않았습니다.</p>`}
      </div>`;
    return `<div class="qa"><p class="qa-q"><span class="no">Q${i + 1}</span><span>${esc(m.q)}</span></p>${body}${src}</div>`;
  }).join("");
  log.querySelectorAll(".chip").forEach((el) => el.addEventListener("click", () => {
    const [i, n] = el.dataset.src.split(":").map(Number);
    const same = state.askSource && state.askSource.i === i && state.askSource.n === n;
    state.askSource = same ? null : { i, n };
    renderAsk();
    renderPanel();
    syncCite();
    if (state.askSource) openDrawer(); else closeDrawer();
  }));
}

// 로그 질의의 근거는 모델이 고른 것이 아니라 코어가 조건으로 찾은 로그입니다. 조건을 함께 보여줍니다.
function criteriaText(c) {
  const parts = Object.entries(c || {}).map(([k, v]) => `${CRITERIA_LABEL[k] || k} ${k === "since" || k === "until" ? stamp(v) : v}`);
  return parts.length ? parts.join(" · ") : "조건 없음 (전체 로그)";
}

function logEvidence(m, i) {
  const on = !!state.askSource && state.askSource.i === i;
  return `<div class="sec"><h4>${icon("db", "sm")}근거 로그</h4>
    <p class="note">조건: ${esc(criteriaText(m.criteria))}</p>
    ${m.facts && m.facts.count
      ? `<div class="chips"><button class="chip" data-src="${i}:0" aria-pressed="${on}" aria-controls="panel">${icon("file", "sm")}<span>해당 로그 ${m.facts.count}건</span><span class="open">${on ? "표시 중" : "로그 보기"}</span></button></div>`
      : `<p class="note">조건에 맞는 로그가 없습니다.</p>`}
  </div>`;
}

// 인용 조항 패널은 열어 둔 근거가 있을 때만 자리를 차지합니다.
function syncCite() {
  document.querySelector(".workspace").classList.toggle("cite", state.mainTab === "ask" && !!state.askSource);
}

function renderAskPanel() {
  const sel = state.askSource;
  const m = sel && asks()[sel.i];
  if (m && askMode() === "log") { renderLogPanel(m, sel.i); return; }
  const source = m && m.sources[sel.n];
  $("panel").innerHTML = `<div class="panel-head"><h3>인용 조항 원문</h3>${CLOSE_BTN}</div>
    <div class="panel-body">${source
      ? `<p class="subject">${esc(chipLabel(source))}</p>
        <div class="meta">Q${sel.i + 1} · ${esc(m.q)}</div>
        <div class="sec"><h4>${icon("book", "sm")}기준 문서 원문</h4><div class="clause">${esc(clauseText(source))}</div></div>
        <p class="note">모델이 밝힌 근거 문서에서 해당 조항을 잘라 보여줍니다.</p>`
      : ""}</div>`;
}

function renderLogPanel(m, i) {
  const f = m.facts;
  const rows = [
    ["해당 로그", `${f.count}건`],
    ["기간", `${stamp(f.first)} ~ ${stamp(f.last)}`],
    ...Object.entries(f.by_user).map(([u, n]) => [u, `${n}건`]),
    ...Object.entries(f.attribute_totals).map(([k, v]) => [`${k} 합계`, String(v)]),
  ];
  const more = f.count > m.evidence.length ? `<p class="note">최근 ${m.evidence.length}건만 표시합니다. 건수 · 합계는 전체 ${f.count}건 기준입니다.</p>` : "";
  $("panel").innerHTML = `<div class="panel-head"><h3>근거 로그</h3>${CLOSE_BTN}</div>
    <div class="panel-body">
      <p class="subject">${esc(criteriaText(m.criteria))}</p>
      <div class="meta">Q${i + 1} · ${esc(m.q)}</div>
      <div class="sec"><h4>${icon("activity", "sm")}집계</h4><div class="box"><table class="kv">
        ${rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table></div></div>
      <div class="sec"><h4>${icon("file", "sm")}로그</h4><div class="box pre">${esc(m.evidence.join("\n"))}</div>${more}</div>
      <p class="note">숫자는 코어가 로그에서 직접 센 값입니다.</p>
    </div>`;
}

async function ask(text) {
  const q = text.trim();
  if (!q || asks().some((m) => m.started)) return;
  $("ask-input").value = "";
  await runAsk(q, () => getJSON(ASK[askMode()].url, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }),
  }));
}

// 질의 기록은 내 것만 옵니다. 메뉴마다 따로라 정책 질의 · 로그 질의를 나눠 받습니다.
async function loadAsks() {
  state.asks = { policy: [], log: [] };
  if (!roleViews().some((v) => RESULT_VIEWS.has(v))) return;
  const toItem = (r) => ({ q: r.question, answer: r.answer, sources: r.sources, criteria: r.criteria, facts: r.facts, evidence: r.evidence, failed: r.failed });
  const [policy, logs] = await Promise.all([getJSON("/api/qa?kind=policy"), getJSON("/api/qa?kind=logs")]);
  state.asks = { policy: policy.map(toItem), log: logs.map(toItem) };
}

async function runAsk(q, fetchAnswer) {
  const m = { q, started: Date.now() };
  asks().push(m);
  renderAsk();
  $("ask-log").scrollTop = $("ask-log").scrollHeight;
  const timer = setInterval(() => { const el = $("ask-wait"); if (el) el.textContent = askWaitLabel(m); }, 1000);
  try {
    Object.assign(m, await fetchAnswer());
  } catch (e) {
    Object.assign(m, { answer: `질의 실패: ${e.message}`, sources: [], failed: true });
  } finally {
    clearInterval(timer);
    m.started = null;
    renderAsk();
    $("ask-log").scrollTop = $("ask-log").scrollHeight;
  }
}

function renderAskExamples() {
  const examples = ASK[askMode()].examples;
  $("ask-ex").innerHTML = `<span class="label">예시</span>` +
    examples.map((q, n) => `<button type="button" data-n="${n}">${esc(q)}</button>`).join("");
  $("ask-ex").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => ask(examples[Number(b.dataset.n)])));
}

$("ask-form").addEventListener("submit", (e) => { e.preventDefault(); ask($("ask-input").value); });

/* ── 분석 실행 — 코어 작업(/api/jobs)을 돌리고 끝날 때까지 진행 상황을 봅니다 ── */
const VIEW_KIND = { policies: "policies", events: "events" };
let jobTimer = null;

function runKindLabel() {
  const kinds = (state.jobs && state.jobs.kinds) || {};
  return `${kinds[VIEW_KIND[state.view]] || "분석"} 실행`;
}

function renderRun() {
  const j = state.jobs;
  const btn = $("run"), txt = $("run-txt");
  // 분석 실행은 정책 관리 · 로그 감시만 합니다. 권한 신청은 들어오면 바로 판정됩니다.
  btn.hidden = !VIEW_KIND[state.view];
  if (btn.hidden) return;
  if (!j) { btn.disabled = true; txt.textContent = "분석 실행 불가"; return; }
  btn.disabled = !!j.running;
  if (j.running) {
    const name = j.kinds[j.running] || j.running;
    txt.textContent = `${name} 중…${j.total ? ` ${j.done}/${j.total}` : ""}`;
  } else {
    txt.textContent = runKindLabel();
  }
  // 로그 감시는 지난번 이후 새 로그만 판정한다는 것이 버튼만 봐서는 보이지 않아 툴팁에 둡니다.
  btn.dataset.tip = VIEW_KIND[state.view] === "events"
    ? "로그 감시|지난 감시 이후 들어온 로그만 판정합니다"
    : VIEW_KIND[state.view] === "policies"
      ? `${runKindLabel()}|솔루션 정책을 RAG 에 적재하고 중복 · 충돌 · 과도한 허용을 판정합니다. 수 분 걸릴 수 있습니다`
      : `${runKindLabel()}|수 분 걸릴 수 있습니다`;
}

async function startJob() {
  try {
    state.jobs = await getJSON(`/api/jobs/${VIEW_KIND[state.view]}`, { method: "POST" });
  } catch (e) {
    alert(`분석을 시작하지 못했습니다: ${e.message}`);
  }
  watchJobs(true);
}

// 작업이 끝나면 저장된 결과를 다시 받아 화면 전체를 갱신합니다.
// 파일이 없을 때처럼 시작하자마자 끝난 작업도 결과 · 실패를 보여줘야 하므로 started 면 바로 갱신합니다.
function watchJobs(started = false) {
  clearInterval(jobTimer);
  renderRun();
  const refresh = async () => {
    state.results = await getJSON("/api/results");
    renderAll();
  };
  if (!roleViews().some((v) => RESULT_VIEWS.has(v))) return;
  if (!state.jobs || !state.jobs.running) {
    if (started) refresh();
    return;
  }
  jobTimer = setInterval(async () => {
    try { state.jobs = await getJSON("/api/jobs"); } catch (e) { return; }
    renderRun();
    if (state.jobs.running) return;
    clearInterval(jobTimer);
    refresh();
  }, 2000);
}

$("run").addEventListener("click", startJob);

/* ── 보기 전환 · 필터 · 검색 ─────────────── */
function setMainTab(tab) {
  const panelChanges = (state.mainTab === "ask") !== (tab === "ask");
  // 탭을 떠나면 열어 둔 인용 조항도 닫습니다. 패널은 그 탭의 것입니다.
  if (panelChanges && state.askSource) {
    state.askSource = null;
    renderAsk();
  }
  state.mainTab = tab;
  document.querySelectorAll(".main-tab").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("view-queue").hidden = tab !== "queue";
  $("view-ask").hidden = tab !== "ask";
  renderFooter();
  document.querySelector(".workspace").dataset.tab = tab;
  syncCite();
  if (panelChanges) renderPanel();
  if (tab === "ask") $("ask-input").focus();
}

document.querySelectorAll(".main-tab").forEach((b) => b.addEventListener("click", () => setMainTab(b.dataset.tab)));

function setView(view) {
  const changed = state.view !== view;
  state.view = view;
  const meta = VIEWS[view];
  document.querySelectorAll(".main-tab").forEach((b) => { b.hidden = !meta.tabs.includes(b.dataset.tab); });
  // 탭이 하나뿐이면 탭 줄 대신 대기열 제목으로 지금 메뉴를 알립니다.
  document.querySelector(".main-tabs").hidden = meta.tabs.length < 2;
  $("queue-title").textContent = view === "requests" ? `${meta.label} — ${state.me.role === "manager" ? "1차" : "최종"} 결재함` : meta.title;
  $("q").placeholder = meta.search;
  $("req-form").hidden = view !== "mine";
  $("stage-filter").hidden = view !== "requests";
  $("add-user").hidden = view !== "users";
  if (!meta.tabs.includes(state.mainTab)) setMainTab("queue");
  if (changed) { state.filter = "전체"; state.panelMsg = ""; }
  // 패널도 메뉴를 따릅니다. 다른 메뉴의 항목이 남아 있으면 이 메뉴의 첫 항목으로 바꿉니다.
  const current = queue().find((i) => i.key === state.selected);
  if (!current || !inView(current)) {
    const first = queue().find(inView);
    state.selected = first ? first.key : null;
  }
  document.querySelectorAll("#seg button").forEach((b) => b.setAttribute("aria-selected", b.dataset.view === view));
  document.querySelectorAll(".nav[data-view]").forEach((b) => b.setAttribute("aria-current", b.dataset.view === view));
  renderStats();   // 요약 카드 숫자가 보기 범위를 따릅니다
  renderRun();     // 실행 버튼이 보기 범위의 분석을 돌립니다
  renderRows();
  renderPanel();
  renderFooter();
  if (changed) {
    // 질의 탭도 메뉴를 따릅니다 (정책 질의 ↔ 로그 질의). 열어 둔 근거는 다른 질의의 것이라 닫습니다.
    state.askSource = null;
    renderAskExamples();
    renderAsk();
    syncCite();
  }
}

// 메뉴는 로그인한 역할에 따라 만듭니다. 넓은 화면은 사이드바, 좁은 화면은 탭 줄 위 세그먼트.
function buildNav() {
  const views = roleViews();
  $("nav-views").innerHTML = views.map((v) =>
    `<button class="nav" data-view="${v}" aria-label="${esc(VIEWS[v].label)}" data-tip-pos="right" data-tip="${esc(VIEWS[v].tip)}">${icon(VIEWS[v].icon)}</button>`).join("");
  $("seg").innerHTML = views.map((v) => `<button role="tab" data-view="${v}">${esc(VIEWS[v].label)} <span data-count="${v}"></span></button>`).join("");
  $("seg").hidden = views.length < 2;
  $("nav-docs").hidden = state.me.role === "user";
  document.querySelectorAll("#seg button, .nav[data-view]").forEach((b) => b.addEventListener("click", () => {
    setMainTab("queue");
    setView(b.dataset.view);
  }));
}

$("stage-filter").addEventListener("change", (e) => {
  state.stageFilter = e.target.value;
  setView(state.view);
});
$("add-user").addEventListener("click", () => {
  state.selected = null;
  state.panelMsg = "";
  renderRows();
  renderPanel();
  openDrawer();
});

$("q").addEventListener("input", (e) => { state.query = e.target.value; renderRows(); });

$("bell").addEventListener("click", (e) => { e.stopPropagation(); $("alert-pop").classList.toggle("show"); });
document.addEventListener("click", (e) => {
  if (!$("alert-pop").contains(e.target)) $("alert-pop").classList.remove("show");
});

$("nav-docs").addEventListener("click", () => {
  $("docs-body").innerHTML = state.regulations.length
    ? state.regulations.map((d) => `<div class="doc"><h4>${esc(d.name)}</h4><pre>${esc(d.content.trim())}</pre></div>`).join("")
    : `<p class="note">기준 문서를 불러오지 못했습니다.</p>`;
  $("docs-modal").classList.add("show");
});
$("docs-close").addEventListener("click", () => $("docs-modal").classList.remove("show"));
$("docs-modal").addEventListener("click", (e) => { if (e.target === $("docs-modal")) $("docs-modal").classList.remove("show"); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  $("docs-modal").classList.remove("show");
  closePanel();
});

/* ── 작은 화면 서랍 — 1150px 미만에서만 패널을 오른쪽 서랍으로 띄웁니다 ── */
const CLOSE_BTN = '<button class="drawer-close" aria-label="닫기">×</button>';
const narrow = matchMedia("(max-width: 1150px)");

function openDrawer() {
  if (!narrow.matches) return;
  $("panel").classList.add("open");
  $("drawer-back").classList.add("show");
  document.body.classList.add("drawer-open");
}

function closeDrawer() {
  $("panel").classList.remove("open");
  $("drawer-back").classList.remove("show");
  document.body.classList.remove("drawer-open");
}

// 정책 질의 탭에서 닫으면 넓은 화면에서도 인용 조항 패널을 접습니다.
function closePanel() {
  closeDrawer();
  if (state.mainTab === "ask" && state.askSource) {
    state.askSource = null;
    renderAsk();
    syncCite();
  }
}

$("drawer-back").addEventListener("click", closePanel);
// 패널 내용은 다시 그려지므로 닫기 버튼은 패널에 위임합니다.
$("panel").addEventListener("click", (e) => { if (e.target.closest(".drawer-close")) closePanel(); });
// 넓은 화면으로 바뀌면 서랍 상태를 풀어 배경 막이 남지 않게 합니다.
narrow.addEventListener("change", (e) => { if (!e.matches) closeDrawer(); });

function renderFooter() {
  // 계산 시각 · 분석 경고는 정책 관리 · 로그 감시 결과의 것이라 그 메뉴에서만 보입니다.
  $("foot").hidden = state.mainTab === "ask" || !RESULT_VIEWS.has(state.view);
  if ($("foot").hidden) return;
  const r = state.results, s = r.summary;
  // 판정 실패 · 읽지 못한 행 · 작업 실패는 문제가 있을 때만 알립니다.
  const warns = [];
  if (s.failed) warns.push(`판정 실패 ${s.failed}건 — 해당 건은 '주의'로 기록되었습니다. 수동 검토가 필요합니다`);
  Object.entries(r.sections || {}).forEach(([name, sec]) => {
    if (sec && sec.load_issues.length) warns.push(`${sec.source}에서 읽지 못한 행 ${sec.load_issues.length}건`);
  });
  Object.entries((state.jobs && state.jobs.last) || {}).forEach(([kind, last]) => {
    if (last.error) warns.push(`${state.jobs.kinds[kind]} 실패 — ${last.error}`);
  });
  const at = r.generated_at ? `계산 시각 ${esc(stamp(r.generated_at))}` : "아직 분석하지 않았습니다";
  $("foot").innerHTML = at + warns.map((w) => ` · <span class="warn">${esc(w)}</span>`).join("");
}

function renderAll() {
  renderTop(); renderStats(); renderRun(); renderRows(); renderAskExamples(); renderAsk(); renderPanel(); renderFooter();
}

/* ── 로그인 · 비밀번호 · 로그아웃 ───────────── */
function showLogin() {
  $("gate").hidden = false;
  $("login-form").hidden = false;
  $("pw-form").hidden = true;
  $("login-form").login_id.focus();
}

function showPassword(forced) {
  $("gate").hidden = false;
  $("login-form").hidden = true;
  $("pw-form").hidden = false;
  $("pw-form").reset();
  $("pw-msg").textContent = "";
  $("pw-title").textContent = forced ? "처음 로그인했습니다" : "비밀번호 변경";
  $("pw-note").textContent = forced ? "계속하려면 비밀번호를 바꾸세요. 루트가 준 임시 비밀번호는 더 쓸 수 없습니다." : "바꾸면 다른 곳에 로그인된 세션은 끊깁니다.";
  $("pw-cancel").hidden = forced;
  $("pw-form").current.focus();
}

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-msg").textContent = "";
  try {
    await send("/api/auth/login", { login_id: e.target.login_id.value, password: e.target.password.value });
    location.reload();
  } catch (err) {
    $("login-msg").textContent = err.message;
    e.target.password.value = "";
  }
});

$("pw-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.new.value !== f.confirm.value) { $("pw-msg").textContent = "새 비밀번호 두 칸이 다릅니다"; return; }
  try {
    await send("/api/auth/password", { current: f.current.value, new: f.new.value });
    location.reload();
  } catch (err) { $("pw-msg").textContent = err.message; }
});
$("pw-cancel").addEventListener("click", () => { $("gate").hidden = true; });
$("btn-password").addEventListener("click", () => showPassword(false));
$("btn-logout").addEventListener("click", async () => {
  try { await send("/api/auth/logout"); } finally { location.reload(); }
});

$("new-request").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    const made = await send("/api/requests", Object.fromEntries(new FormData(f)));
    f.reset();
    $("req-form-msg").className = "form-msg ok";

    state.selected = `mine:${made.request_no}`;
    await refreshRequests();
  } catch (err) {
    $("req-form-msg").className = "form-msg";
    $("req-form-msg").textContent = err.message;
  }
});

/* ── 툴팁 — data-tip="제목|설명". 다시 그려도 동작하도록 document 에 위임합니다 ── */
const tip = document.createElement("div");
tip.className = "tip";
tip.setAttribute("role", "tooltip");
document.body.appendChild(tip);
let tipTarget = null, tipTimer = null;

function placeTip(el) {
  const r = el.getBoundingClientRect();
  const pos = el.dataset.tipPos || "bottom";
  const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 8;
  let x, y;
  if (pos === "right") {
    x = r.right + gap + 2; y = r.top + r.height / 2 - th / 2;
  } else {
    x = r.left + r.width / 2 - tw / 2; y = r.bottom + gap;
    if (y + th > innerHeight - gap) y = r.top - th - gap;   // 아래 공간이 없으면 위로
  }
  tip.style.left = Math.max(gap, Math.min(x, innerWidth - tw - gap)) + "px";
  tip.style.top = Math.max(gap, Math.min(y, innerHeight - th - gap)) + "px";
  tip.dataset.pos = pos;
}

function showTip(el) {
  const [title, desc] = String(el.dataset.tip || "").split("|");
  if (!title) return;
  tipTarget = el;
  tip.innerHTML = desc ? `<b>${esc(title)}</b><span>${esc(desc)}</span>` : `<span style="color:#fff;margin:0">${esc(title)}</span>`;
  tip.classList.remove("show");
  placeTip(el);
  requestAnimationFrame(() => tip.classList.add("show"));
}

function hideTip() {
  clearTimeout(tipTimer);
  tipTarget = null;
  tip.classList.remove("show");
}

document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]");
  if (el === tipTarget) return;
  clearTimeout(tipTimer);
  if (!el) { hideTip(); return; }
  // 사이드바 · 상단 바는 바로, 나머지는 목록을 훑을 때 깜빡이지 않게 살짝 늦게
  const instant = el.closest(".sidebar, .topbar");
  tipTimer = setTimeout(() => showTip(el), instant ? 0 : 220);
});
document.addEventListener("focusin", (e) => {
  const el = e.target.closest("[data-tip]");
  if (el) showTip(el); else hideTip();
});
document.addEventListener("focusout", hideTip);
document.addEventListener("scroll", hideTip, true);
document.addEventListener("click", hideTip, true);

paintIcons();

async function boot() {
  try {
    state.me = await getJSON("/api/auth/me");
  } catch (e) {
    return;   // 401 이면 getJSON 이 로그인 화면을 띄웠습니다
  }
  if (state.me.must_change_password) { showPassword(true); return; }
  $("who").hidden = false;
  $("who-name").textContent = `${state.me.display_name} · ${ROLE_LABEL[state.me.role]}${state.me.is_root ? " (루트)" : ""}`;
  // 메뉴가 하나뿐인 일반사용자는 사이드바 없이 신청 화면만 씁니다.
  document.body.classList.toggle("solo", roleViews().length < 2);
  buildNav();
  await Promise.all([loadData(), loadAsks()]);
  const views = roleViews();
  setView(views[0]);
  renderAll();
  watchJobs();   // 다른 창에서 시작한 작업이 돌고 있으면 이어서 지켜봅니다
}

boot().catch((e) => {
  document.querySelector(".workspace").innerHTML =
    `<div class="card empty" style="grid-column:1/-1">서버에서 화면 데이터를 받지 못했습니다: ${esc(e.message)}</div>`;
});
</script>
</body>
</html>
