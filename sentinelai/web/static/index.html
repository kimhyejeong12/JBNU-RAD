      <div class="rec-line lv-${it.level}">${icon(LEVEL_ICON[it.level] || "warn")}${esc(it.level)}</div>
      <div class="meta">${esc(it.id)}</div>

      ${isServer ? `
      ${Object.values(r.detail.state).some((v) => v) ? `<div class="sec"><h4>${icon("server", "sm")}서버 현황</h4>${kvTable(Object.entries(r.detail.state).filter(([, v]) => v))}</div>` : ""}
      ${moduleState(r.detail.snapshot)}
      <div class="sec"><h4>${icon("file", "sm")}이 서버에 걸린 정책</h4><div class="box pre">${esc(r.detail.matched)}</div>
        <p class="note">IP · 대역 · 호스트 이름이 맞는 규칙을 코드가 찾았습니다. 그 밖의 규칙은 AI가 검색해 함께 봅니다.</p></div>` : `
      <div class="sec"><h4>${icon("file", "sm")}${isEvent ? "판정한 로그" : "관련 정책 원본"}</h4>
        ${isEvent
          ? `<div class="box pre">${esc((r.detail && r.detail.events) || "로그 없음")}</div>
            <button class="rerun" id="to-logs">${icon("search", "sm")}이 사용자의 최근 한 달 로그</button>`
          : `<div class="box"><table class="kv">
          ${table.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("") || "<tr><td>정보 없음</td></tr>"}
        </table></div>`}
      </div>`}

      ${gapped ? `
      <div class="sec"><h4>${icon("activity", "sm")}요약</h4><div class="box">${esc(r.reason)}</div></div>
      <div class="sec"><h4>${icon("warn", "sm")}정책과 다른 곳 ${r.gaps.length}</h4>
        ${r.gaps.map((g, n) => `<div class="gap">
          <div class="gap-head"><span class="ldot ${esc(g.level)}"></span>${esc(g.item)}</div>
          <table class="kv"><tr><th>지금</th><td>${esc(g.current)}</td></tr><tr><th>기준</th><td>${esc(g.required)}</td></tr>
            <tr><th>바꿀 것</th><td>${esc(g.change)}</td></tr></table>
          ${g.source ? sourceChips(`${it.key}:gap${n}`, [g.source]) : ""}
        </div>`).join("") || `<div class="box">기준 문서와 다른 곳을 찾지 못했습니다.</div>`}
        ${r.unjudged.length ? `<p class="note">다루는 조항이 없어 판단하지 않은 항목: ${esc(r.unjudged.join(", "))}</p>` : ""}
      </div>` : `
      <div class="sec"><h4>${icon("activity", "sm")}판단 이유</h4>
        <div class="box">${esc(r.reason)}</div>
      </div>

      <div class="sec"><h4>${icon("ok", "sm")}권고 조치</h4>
        <div class="box">${esc(r.recommendation)}</div>
      </div>

      <div class="sec"><h4>${icon("db", "sm")}근거 조항</h4>
        ${it.type !== "policy"
          ? sourceChips(it.key, r.sources)
          : `<p class="note">정책 관리 검토는 근거 조항을 판단 이유에 함께 적습니다. 적용 기준은 기준 문서 5 · 6장입니다.</p>`}
      </div>`}
      ${decisionLog(it)}
    </div>
    ${r.stage === "fast" ? `<div class="panel-foot"><h4>1차 판정 — 확정 대기</h4>
      <p class="note">빠른 감시(${esc(fastEvery())})가 생각 단계 없이 낸 판정입니다. 정밀 감시가 같은 로그를 다시 판정하면 확정 판정으로 바뀌고, 그때 결정할 수 있습니다. 빠른 판정은 주의 · 위험을 실제보다 많이 걸 수 있습니다.</p></div>` : `
    <div class="panel-foot">
      <h4>의사결정</h4>
      <textarea id="review-comment" maxlength="2000" placeholder="결정 의견 (선택)"></textarea>
      <div class="decide">
        ${Object.entries(DECISION_SET[it.type]).map(([a, cls]) =>
          `<button class="${cls}" data-action="${a}" aria-pressed="${decision && decision.action === a}">${DECISIONS[a]}</button>`).join("")}
      </div>
      <div class="decision-state">${decision
        ? `<span>결정 <b>${esc(DECISIONS[decision.action])}</b> · ${esc(`${decision.decider_department} ${decision.decider_name}`.trim())} · ${esc(stamp(decision.decided_at))}${decision.ai_level ? ` (그때 AI 판정: ${esc(decision.ai_level)})` : ""}${decision.comment ? ` — ${esc(decision.comment)}` : ""}</span><button id="undo">취소</button>`
        : `<span>AI는 권고만 합니다. 최종 결정은 사람이 내립니다.</span>`}</div>
      ${panelMsg()}
    </div>`}`;

  bindChips(panel);
  const toLogs = $("to-logs");
  if (toLogs) toLogs.addEventListener("click", () => openLogs({ user: r.title, period: "month" }));
  panel.querySelectorAll(".decide button").forEach((el) => el.addEventListener("click", () => reviewDecision(it, el.dataset.action)));
  const undo = $("undo");
  if (undo) undo.addEventListener("click", () => reviewDecision(it, "cancel"));
}

// 수집 노드가 읽어 온 모듈 상태. 직전 수집과 달라진 설정을 먼저 보여줍니다.
function moduleState(snap) {
  if (!snap || !snap.modules) return "";
  const changed = (snap.changes || []).length
    ? `<div class="box pre">${esc(snap.changes.join("\n"))}</div>` : `<p class="note">직전 수집과 달라진 설정이 없습니다.</p>`;
  return `<div class="sec"><h4>${icon("activity", "sm")}직전 수집과 달라진 설정</h4>${changed}</div>${moduleTables(snap)}`;
}

function moduleTables(snap) {
  return `<div class="sec"><h4>${icon("db", "sm")}모듈 상태</h4>
      <p class="note">${esc(stamp(snap.collected_at))} 수집 · ${esc(snap.collected_by || "수집 계정 모름")}</p>
      ${Object.entries(snap.modules).map(([m, facts]) => `<p class="mod-name">${esc(MODULE_LABEL[m] || m)}</p>${kvTable(Object.entries(facts))}`).join("")}
    </div>`;
}

// 보안 총책임자에게만 결정 기록 전부가 옵니다 (decision_log). 누가 어떤 판단을 했다가 취소했는지까지 읽습니다.
function decisionLog(it) {
  const log = state.results.decision_log;
  if (!log) return "";
  const rows = (log[it.type] || {})[it.itemKey] || [];
  const steps = rows.map((d) => `<div class="step"><b>${d.action === "cancel" ? "결정 취소" : esc(DECISIONS[d.action])}</b>
      · ${esc(d.decider_name)}${d.decider_department ? ` (${esc(d.decider_department)})` : ""}
      <span class="when">${esc(stamp(d.decided_at))}${d.ai_level ? ` · 그때 AI 판정 ${esc(d.ai_level)}` : ""}</span>
      ${d.comment ? `<span class="say">${esc(d.comment)}</span>` : ""}</div>`);
  return `<div class="sec"><h4>${icon("list", "sm")}결정 기록</h4>${steps.length
    ? `<div class="box history">${steps.join("")}</div>` : `<p class="note">아직 결정이 없습니다.</p>`}</div>`;
}

function sourceChips(key, sources) {
  if (!(sources || []).length) return `<p class="note">모델이 근거 문서를 반환하지 않았습니다.</p>`;
  return `<div class="chips">${sources.map((s, n) => {
    const k = `${key}#${n}`, open = state.expanded.has(k);
    return `<button class="chip" data-k="${esc(k)}" aria-expanded="${open}">${icon("file", "sm")}<span>${esc(chipLabel(s))}</span><span class="open">${open ? "접기" : "조항 전문"}</span></button>
      ${open ? `<div class="clause">${esc(clauseText(s))}</div>` : ""}`;
  }).join("")}</div>`;
}

function bindChips(panel) {
  panel.querySelectorAll(".chip[data-k]").forEach((el) => el.addEventListener("click", () => {
    const k = el.dataset.k;
    state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
    renderPanel();
  }));
}

const kvTable = (rows) => `<div class="box"><table class="kv">${rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table></div>`;
const panelMsg = () => (state.panelMsg ? `<p class="form-msg${state.panelMsg.startsWith("✓") ? " ok" : ""}">${esc(state.panelMsg)}</p>` : "");

/* ── 권한 신청 패널 — 결재자에게는 AI 판정과 결재 · 회수, 신청자에게는 상태와 철회 ── */
function renderRequestPanel(it) {
  const r = it.raw, me = state.me, applicant = me.role === "user";
  const v = r.ai_verdict;
  const canDecide = !applicant && r.stage === STEP[me.role];
  const canRevoke = !applicant && r.stage === "approved";
  const canWithdraw = applicant && r.stage === "manager";

  let ai = "";
  if (!applicant) {
    if (r.judging) ai = `<div class="sec"><h4>${icon("activity", "sm")}AI 판정</h4><div class="box">AI가 판정하고 있습니다… (수십 초)</div></div>`;
    else if (!v) ai = `<div class="sec"><h4>${icon("activity", "sm")}AI 판정</h4><div class="box">아직 판정이 없습니다.</div></div>`;
    else if (v.failed) ai = `<div class="sec"><h4>${icon("activity", "sm")}AI 판정</h4><div class="box warn">판정 실패 — ${esc(v.error || "원인 불명")}. 수동으로 검토하거나 다시 판정하세요.</div></div>`;
    else ai = `
      <div class="sec"><h4>${icon("activity", "sm")}AI 판단 이유</h4><div class="box">${esc(v.reason)}</div></div>
      <div class="sec"><h4>${icon("ok", "sm")}AI 권고</h4><div class="box">${esc(v.recommendation)}</div></div>
      <div class="sec"><h4>${icon("db", "sm")}근거 조항</h4>${sourceChips(it.key, v.sources)}</div>
      <p class="note">${esc(v.model)} · ${esc(stamp(v.judged_at))} 판정</p>`;
  }

  const steps = [
    ...r.approvals.map((a) => `<div class="step"><b>${a.step === "manager" ? "1차" : "최종"} ${a.action === "approve" ? "승인" : "반려"}</b>
      · ${esc(a.approver_name)}${a.approver_department ? ` (${esc(a.approver_department)})` : ""}
      <span class="when">${esc(stamp(a.decided_at))}${!applicant && a.ai_level ? ` · 그때 AI 판정 ${esc(a.ai_level)}` : ""}</span>
      ${a.comment ? `<span class="say">${esc(a.comment)}</span>` : ""}</div>`),
    ...(r.revocation ? [`<div class="step"><b>회수</b> · ${esc(r.revocation.revoker_name)}${r.revocation.revoker_department ? ` (${esc(r.revocation.revoker_department)})` : ""}
      <span class="when">${esc(stamp(r.revocation.revoked_at))}</span><span class="say">${esc(r.revocation.reason)}</span></div>`] : []),
  ];

  let foot;
  if (canDecide) {
    foot = `<h4>${me.role === "manager" ? "1차 결재" : "최종 결재"}</h4>
      <textarea id="decision-comment" maxlength="2000" placeholder="결재 의견 (선택)"></textarea>
      <div class="panel-actions"><button class="good" data-act="approve">승인</button><button class="danger" data-act="reject">반려</button></div>
      <p class="note">AI는 권고만 합니다. 결재는 지금 보이는 AI 판정과 함께 기록됩니다.</p>`;
  } else if (canRevoke) {
    foot = `<h4>권한 회수</h4>
      <input id="revoke-reason" maxlength="2000" placeholder="회수 사유 (필수)">
      <div class="panel-actions"><button class="danger" data-act="revoke">회수</button></div>`;
  } else if (canWithdraw) {
    foot = `<h4>신청 철회</h4><p class="note">1차 결재 전에만 철회할 수 있습니다. 반려 · 철회 뒤에는 새로 신청합니다.</p>
      <div class="panel-actions"><button data-act="withdraw">철회</button></div>`;
  } else {
    foot = `<h4>${esc(STAGE_LABEL[r.stage])}</h4><p class="note">${
      applicant ? "결재가 끝나거나 진행 중인 신청입니다."
      : r.stage === "manager" || r.stage === "top" ? `${STAGE_LABEL[r.stage]} — 내 결재 단계가 아닙니다.` : "더 할 결재가 없습니다."}</p>`;
  }

  const rows = [["신청자", requester(r)], ["신청 권한", r.access_code ? `${r.requested_access} (${r.access_code})` : r.requested_access], ["신청 때 보유 권한", r.current_access || "—"],
                ["신청 사유", r.reason || "—"], ["사용 기간", period(r)], ["신청 시각", stamp(r.submitted_at)], ["상태", STAGE_LABEL[r.stage]]];
  const rejudge = !applicant && !r.judging && r.stage === "manager";
  $("panel").innerHTML = `
    <div class="panel-head">
      <h3>${applicant ? "내 신청" : "권한 신청 검토"}</h3>
      ${rejudge ? `<button class="rerun" data-act="rejudge">${icon("activity", "sm")}다시 판정</button>` : ""}
      ${CLOSE_BTN}
    </div>
    <div class="panel-body">
      <p class="subject">${esc(r.requested_access)}</p>
      ${applicant ? "" : `<div class="rec-line ${it.level ? `lv-${it.level}` : ""}">${it.level ? icon(LEVEL_ICON[it.level]) : ""}${esc(it.judge)}</div>`}
      <div class="meta">${esc(r.request_no)} · ${esc(STAGE_LABEL[r.stage])}</div>
      <div class="sec"><h4>${icon("file", "sm")}신청 내용</h4>${kvTable(rows)}</div>
      ${ai}
      <div class="sec"><h4>${icon("list", "sm")}결재 기록</h4>${steps.length ? `<div class="box history">${steps.join("")}</div>` : `<p class="note">아직 결재가 없습니다.</p>`}</div>
    </div>
    <div class="panel-foot">${foot}${panelMsg()}</div>`;

  bindChips($("panel"));
  $("panel").querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => requestAction(r.request_no, b.dataset.act)));
}

async function reviewDecision(it, action) {
  try {
    const res = await send("/api/decisions", {
      kind: it.type, item_key: it.itemKey, action, ai_level: it.level || null,
      subject: it.type === "policy" ? `${it.who} · ${it.raw.kind}` : it.raw.title,
      comment: action === "cancel" ? "" : ($("review-comment") || {}).value || "",
    });
    const all = state.results.decisions || (state.results.decisions = {});
    const mine = all[it.type] || (all[it.type] = {});
    if (res.decision) mine[it.itemKey] = res.decision; else delete mine[it.itemKey];
    if (state.results.decision_log) state.results.decision_log = (await getJSON("/api/results")).decision_log;
    state.panelMsg = action === "cancel" ? "✓ 결정을 취소했습니다" : `✓ 기록했습니다 — ${DECISIONS[action]}`;
  } catch (e) {
    state.panelMsg = e.message;
  }
  renderAfterChange();
}

async function requestAction(no, act) {
  const base = `/api/requests/${encodeURIComponent(no)}`;
  try {
    if (act === "approve" || act === "reject") {
      if (act === "reject" && !confirm(`${no} 신청을 반려합니다. 반려하면 신청자는 새로 신청해야 합니다.`)) return;
      await send(`${base}/decision`, { action: act, comment: ($("decision-comment") || {}).value || "" });
      state.panelMsg = `✓ ${act === "approve" ? "승인" : "반려"}했습니다`;
    } else if (act === "revoke") {
      const reason = ($("revoke-reason") || {}).value || "";
      if (!reason.trim()) { state.panelMsg = "회수 사유를 적어 주세요"; renderPanel(); return; }
      if (!confirm(`${no} 권한을 회수합니다.`)) return;
      await send(`${base}/revoke`, { reason });
      state.panelMsg = "✓ 회수했습니다";
    } else if (act === "withdraw") {
      if (!confirm(`${no} 신청을 철회합니다.`)) return;
      await send(`${base}/withdraw`);
      state.panelMsg = "✓ 철회했습니다";
    } else if (act === "rejudge") {
      await send(`${base}/rejudge`);
      state.panelMsg = "";
    }
  } catch (e) {
    state.panelMsg = e.message;
  }
  await refreshRequests();
}

/* ── 계정 관리 패널 (보안 총책임자) — 선택 없음 = 새 계정. 루트 계정은 루트만, 자기 역할 · 활성은 못 바꿈 ── */
function renderUserPanel(u) {
  const roleOptions = (sel, disabled) => `<select name="role" ${disabled ? "disabled" : ""}>${Object.entries(ROLE_LABEL)
    .map(([k, label]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${label}</option>`).join("")}</select>`;
  if (!u) {
    $("panel").innerHTML = `
      <div class="panel-head"><h3>새 계정</h3>${CLOSE_BTN}</div>
      <form class="panel-body form-grid" id="user-form" style="padding:16px 18px">
        <label>아이디<input name="login_id" required maxlength="100" autocomplete="off"></label>
        <label>이름<input name="display_name" required maxlength="100"></label>
        <label>부서<input name="department" maxlength="100"></label>
        <label>역할${roleOptions("user")}</label>
        <label class="wide">임시 비밀번호 (첫 로그인에 바꾸게 됩니다)<input name="password" type="password" required autocomplete="new-password"></label>
        <div class="wide form-actions">${panelMsg()}<button type="submit" class="primary">계정 만들기</button></div>
      </form>`;
    $("user-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      try {
        const made = await send("/api/users", body);
        state.panelMsg = `✓ ${made.login_id} 계정을 만들었습니다`;
        await refreshUsers(`user:${made.id}`);
      } catch (err) { state.panelMsg = err.message; renderPanel(); }
    });
    return;
  }
  // 루트 계정은 루트만 고칩니다. 자기 계정과 루트는 역할 · 활성을 바꿀 수 없습니다 (서버도 막습니다).
  const self = u.id === state.me.id;
  const locked = u.is_root && !state.me.is_root;
  const fixed = u.is_root || self;
  const note = locked ? "루트 계정은 루트만 고칠 수 있습니다."
    : u.is_root ? "루트는 역할을 바꾸거나 정지할 수 없습니다."
    : self ? "자기 계정의 역할을 바꾸거나 정지할 수 없습니다."
    : "계정은 지우지 않고 정지합니다 (결재 기록이 가리킵니다).";
  $("panel").innerHTML = `
    <div class="panel-head"><h3>계정</h3>${CLOSE_BTN}</div>
    <div class="panel-body">
      <p class="subject">${esc(u.display_name)} (${esc(u.login_id)})</p>
      <div class="meta">${esc(ROLE_LABEL[u.role])}${u.is_root ? " · 루트" : ""} · 만든 날 ${esc(stamp(u.created_at))}${u.last_login_at ? ` · 마지막 로그인 ${esc(stamp(u.last_login_at))}` : ""}</div>
      ${locked ? "" : `<form class="form-grid" id="user-edit" style="padding:12px 0 0">
        <label>이름<input name="display_name" value="${esc(u.display_name)}" maxlength="100"></label>
        <label>부서<input name="department" value="${esc(u.department)}" maxlength="100"></label>
        <label>역할${roleOptions(u.role, fixed)}</label>
        <label>로그 사용자 ID<input name="log_id" value="${esc(u.log_id || "")}" maxlength="100" placeholder="보안 솔루션 로그의 UserID"></label>
        <label class="check wide"><input type="checkbox" name="is_active" ${u.is_active ? "checked" : ""} ${fixed ? "disabled" : ""}>활성 (끄면 정지 · 세션 끊김)</label>
        <div class="wide form-actions"><button type="submit" class="primary">저장</button></div>
      </form>
      <form class="form-grid" id="user-reset" style="padding:12px 0 0">
        <label class="wide">비밀번호 초기화 — 임시 비밀번호<input name="temporary_password" type="password" required autocomplete="new-password"></label>
        <div class="wide form-actions"><button type="submit">초기화</button></div>
      </form>`}
    </div>
    <div class="panel-foot">${panelMsg() || `<p class="note">${note}</p>`}</div>`;
  if (locked) return;
  $("user-edit").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = { display_name: f.display_name.value, department: f.department.value, log_id: f.log_id.value };
    if (!fixed) { body.role = f.role.value; body.is_active = f.is_active.checked; }
    try { await send(`/api/users/${u.id}`, body, "PATCH"); state.panelMsg = "✓ 저장했습니다"; }
    catch (err) { state.panelMsg = err.message; }
    await refreshUsers(`user:${u.id}`);
  });
  $("user-reset").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await send(`/api/users/${u.id}/reset-password`, { temporary_password: e.target.temporary_password.value });
      state.panelMsg = "✓ 초기화했습니다. 다음 로그인에 비밀번호를 바꾸게 됩니다";
    } catch (err) { state.panelMsg = err.message; }
    await refreshUsers(`user:${u.id}`);
  });
}

/* ── 권한 목록 패널 (보안 총책임자) — 선택 없음 = 권한 등록. 지난 신청이 코드를 가리키므로 코드는 못 바꾸고, 지우지 않고 끕니다 ── */
function renderAccessPanel(a) {
  const fields = (v = {}) => `
        <label>이름<input name="name" required maxlength="100" value="${esc(v.name)}" placeholder="예: 급여 테이블 조회"></label>
        <label>시스템<input name="system" maxlength="100" value="${esc(v.system)}" placeholder="예: 인사 시스템"></label>
        <label>분류<input name="category" maxlength="100" value="${esc(v.category)}" placeholder="예: 급여정보 · 인사정보 · 관리자"></label>
        <label class="wide">설명 (AI 판정에도 함께 넘깁니다)<textarea name="description" rows="2" maxlength="2000" placeholder="무엇을 할 수 있는 권한인지">${esc(v.description)}</textarea></label>`;
  if (!a) {
    $("panel").innerHTML = `
      <div class="panel-head"><h3>권한 등록</h3>${CLOSE_BTN}</div>
      <form class="panel-body form-grid" id="access-form" style="padding:16px 18px">
        <label>코드 (바꿀 수 없음)<input name="code" required maxlength="64" pattern="[A-Za-z0-9_.\-]+" autocomplete="off" placeholder="예: HR_SALARY_READ"></label>
        ${fields()}
        <div class="wide form-actions">${panelMsg()}<button type="submit" class="primary">등록</button></div>
      </form>`;
    $("access-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const made = await send("/api/access-catalog", Object.fromEntries(new FormData(e.target)));
        state.panelMsg = `✓ ${made.code} 를 등록했습니다`;
        await refreshCatalog(`access:${made.code}`);
      } catch (err) { state.panelMsg = err.message; renderPanel(); }
    });
    return;
  }
  const used = state.requests.filter((r) => r.access_code === a.code);
  const active = used.filter(isActive).length;
  $("panel").innerHTML = `
    <div class="panel-head"><h3>권한</h3>${CLOSE_BTN}</div>
    <div class="panel-body">
      <p class="subject">${esc(a.name)} (${esc(a.code)})</p>
      <div class="meta">${a.is_active ? "켜짐 — 일반 사용자가 신청할 수 있습니다" : "꺼짐 — 새로 신청할 수 없습니다"} · 신청 ${used.length}건 · 유효 ${active}건 · 등록 ${esc(stamp(a.created_at))}</div>
      <form class="form-grid" id="access-edit" style="padding:12px 0 0">
        ${fields(a)}
        <label class="check wide"><input type="checkbox" name="is_active" ${a.is_active ? "checked" : ""}>켜짐 (끄면 새 신청만 막고, 이미 받은 권한 · 결재 중인 신청은 그대로)</label>
        <div class="wide form-actions"><button type="submit" class="primary">저장</button></div>
      </form>
    </div>
    <div class="panel-foot">${panelMsg() || `<p class="note">이름을 바꿔도 이미 낸 신청에는 신청 때 이름이 남습니다.</p>`}</div>`;
  $("access-edit").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = { name: f.name.value, system: f.system.value, category: f.category.value, description: f.description.value, is_active: f.is_active.checked };
    try { await send(`/api/access-catalog/${encodeURIComponent(a.code)}`, body, "PATCH"); state.panelMsg = "✓ 저장했습니다"; }
    catch (err) { state.panelMsg = err.message; }
    await refreshCatalog(`access:${a.code}`);
  });
}

/* ── 신청서 — 권한은 권한 목록의 켜진 권한만 시스템별로 고르고, 현재 보유 권한은 적지 않고 승인된 유효 권한을 보여줍니다 ── */
function renderAccessSelect() {
  const held = new Set(state.mine.filter(isActive).map((r) => r.access_code));
  const pending = new Set(state.mine.filter((r) => r.stage === "manager" || r.stage === "top").map((r) => r.access_code));
  const items = state.catalog.filter((a) => a.is_active);
  const groups = {};
  items.forEach((a) => { (groups[a.system || "기타"] ||= []).push(a); });
  const option = (a) => {
    const why = held.has(a.code) ? " (보유 중)" : pending.has(a.code) ? " (결재 중)" : "";
    return `<option value="${esc(a.code)}" ${why ? "disabled" : ""}>${esc(a.name)}${a.category ? ` · ${esc(a.category)}` : ""}${why}</option>`;
  };
  const prev = $("req-access").value;
  $("req-access").innerHTML = items.length
    ? `<option value="">권한을 고르세요</option>` + Object.entries(groups).map(([sys, list]) =>
        `<optgroup label="${esc(sys)}">${list.map(option).join("")}</optgroup>`).join("")
    : `<option value="">신청할 수 있는 권한이 없습니다</option>`;
  if (prev && !held.has(prev) && !pending.has(prev)) $("req-access").value = prev;
  $("req-access").disabled = !items.length;
  $("new-request").querySelector("button[type=submit]").disabled = !items.length;
  renderAccessNote();
  renderHeld();
}

// 서버도 신청 때 같은 조건(최종 승인 · 기간 남음)으로 읽어 신청 행에 남기므로, 여기서는 보여주기만 합니다.
function renderHeld() {
  const held = state.mine.filter(isActive);
  $("req-held").innerHTML = held.length
    ? `<ul>${held.map((r) => `<li>${esc(r.requested_access)} <span class="note">${r.period_end ? `${esc(r.period_end)}까지` : "기간 없음"}</span></li>`).join("")}</ul>`
    : `<p class="note">이 시스템에서 승인받은 유효 권한이 없습니다.</p>`;
}

function renderAccessNote() {
  const a = state.catalog.find((x) => x.code === $("req-access").value);
  $("req-access-note").textContent = a ? a.description || "" : state.catalog.some((x) => x.is_active) ? ""
    : "보안 총책임자가 권한 목록을 등록하면 신청할 수 있습니다. 필요한 권한이 목록에 없으면 보안 총책임자에게 등록을 요청하세요.";
}

async function refreshCatalog(selectKey) {
  try { state.catalog = await getJSON("/api/access-catalog"); } catch (e) { return; }
  state.selected = selectKey || state.selected;
  renderStats(); renderRows(); renderPanel();
}

function renderAfterChange() {
  renderTop(); renderRows(); renderPanel();
}

/* ── 다시 받기 — 결재 · 회수 · 계정 변경 뒤, 그리고 AI 판정이 끝나기를 기다릴 때 ── */
async function refreshRequests() {
  const views = roleViews();
  try {
    await Promise.all([
      views.includes("requests") ? getJSON("/api/requests").then((d) => { state.requests = d; }) : null,
      views.includes("mine") ? getJSON("/api/requests?mine=true").then((d) => { state.mine = d; }) : null,
    ]);
  } catch (e) { return; }
  // 결재 · 회수로 목록에서 빠진 항목을 고르고 있었으면 같은 신청을 다른 메뉴에서 찾지 않고 그대로 비웁니다.
  if (!queue().some((i) => i.key === state.selected)) state.selected = null;
  if (state.view === "mine") renderAccessSelect();
  renderTop(); renderStats(); renderRows(); renderPanel();
}

async function refreshUsers(selectKey) {
  try { state.users = await getJSON("/api/users"); } catch (e) { return; }
  state.selected = selectKey || state.selected;
  renderStats(); renderRows(); renderPanel();
}

// 판정 중인 신청이 있으면 끝날 때까지 3초마다 다시 받습니다. 입력 중인 결재 의견을 지우지 않게 패널은 판정이 끝난 그 항목일 때만 다시 그립니다.
setInterval(async () => {
  if (!state.me || state.me.role === "user") return;
  const judging = () => state.requests.filter((r) => r.judging).map((r) => r.request_no);
  const before = judging();
  if (!before.length) return;
  const sel = state.selected;
  try {
    state.requests = await getJSON("/api/requests");
  } catch (e) { return; }
  const after = new Set(judging());
  renderTop(); renderStats(); renderRows();
  if (sel && before.some((no) => sel.endsWith(`:${no}`) && !after.has(no))) renderPanel();
}, 3000);

/* ── 질의 — 정책 질의(Answer)도 로그 질의도 등급이 없으므로 등급 배지를 달지 않습니다 ── */
// 질의는 메뉴의 기능입니다 — 정책 질의 메뉴는 기준 문서, 정책 관리는 수집 노드 서버, 로그 감시는 로그에 묻습니다.
const askMode = () => ({ events: "log", policies: "server" }[state.view] || "policy");
const asks = () => state.asks[askMode()];

function askWaitLabel(m) {
  return `답변 생성 중… ${Math.round((Date.now() - m.started) / 1000)}초`;
}

function renderAsk() {
  const log = $("ask-log");
  const mode = askMode(), cfg = ASK[mode], list = asks();
  $("tab-ask-label").textContent = cfg.label;
  $("ask-input").placeholder = cfg.placeholder;
  $("ask-note").textContent = cfg.note;
  const busy = list.some((m) => m.started);
  $("ask-send").disabled = busy;
  $("ask-ex").querySelectorAll("button").forEach((b) => { b.disabled = busy; });
  if (!list.length) {
    log.innerHTML = `<div class="empty">${esc(cfg.empty)}<br>답변에 수십 초 이상 걸릴 수 있습니다.</div>`;
    return;
  }
  log.innerHTML = list.map((m, i) => {
    let body;
    if (m.started) body = `<div class="box wait" id="ask-wait">${askWaitLabel(m)}</div>`;
    else if (m.failed) body = `<div class="box fail">${esc(m.answer)}</div>`;
    else body = `<div class="box">${esc(m.answer)}</div>`;
    const src = m.started || m.failed ? "" : mode === "log" ? logEvidence(m, i) : mode === "server" ? serverEvidence(m, i) : `
      <div class="sec"><h4>${icon("db", "sm")}근거 조항</h4>
        ${(m.sources || []).length
          ? `<div class="chips">${m.sources.map((s, n) => {
              const on = !!state.askSource && state.askSource.i === i && state.askSource.n === n;
              return `<button class="chip" data-src="${i}:${n}" aria-pressed="${on}" aria-controls="panel">${icon("file", "sm")}<span>${esc(chipLabel(s))}</span><span class="open">${on ? "표시 중" : "조항 전문"}</span></button>`;
            }).join("")}</div>`
          : `<p class="note">모델이 근거 문서를 반환하지 않았습니다.</p>`}
      </div>`;
    return `<div class="qa"><p class="qa-q"><span class="no">Q${i + 1}</span><span>${esc(m.q)}</span></p>${body}${src}</div>`;
  }).join("");
  log.querySelectorAll(".chip").forEach((el) => el.addEventListener("click", () => {
    const [i, n] = el.dataset.src.split(":").map(Number);
    const same = state.askSource && state.askSource.i === i && state.askSource.n === n;
    state.askSource = same ? null : { i, n };
    renderAsk();
    renderPanel();
    syncCite();
    if (state.askSource) openDrawer(); else closeDrawer();
  }));
}

// 로그 질의의 근거는 모델이 고른 것이 아니라 코어가 조건으로 찾은 로그입니다. 조건을 함께 보여줍니다.
function criteriaText(c) {
  const parts = Object.entries(c || {}).map(([k, v]) => `${CRITERIA_LABEL[k] || k} ${k === "since" || k === "until" ? stamp(v) : v}`);
  return parts.length ? parts.join(" · ") : "조건 없음 (전체 로그)";
}

function logEvidence(m, i) {
  const on = !!state.askSource && state.askSource.i === i;
  return `<div class="sec"><h4>${icon("db", "sm")}근거 로그</h4>
    <p class="note">조건: ${esc(criteriaText(m.criteria))}</p>
    ${m.facts && m.facts.count
      ? `<div class="chips"><button class="chip" data-src="${i}:0" aria-pressed="${on}" aria-controls="panel">${icon("file", "sm")}<span>해당 로그 ${m.facts.count}건</span><span class="open">${on ? "표시 중" : "로그 보기"}</span></button></div>`
      : `<p class="note">조건에 맞는 로그가 없습니다.</p>`}
  </div>`;
}

// 서버 질의의 근거도 코어가 조건으로 고른 수집 · 서버 점검 기록입니다.
function serverEvidence(m, i) {
  const on = !!state.askSource && state.askSource.i === i;
  const nodes = m.facts ? m.facts["노드 수"] : 0;
  return `<div class="sec"><h4>${icon("db", "sm")}근거 기록</h4>
    <p class="note">조건: ${esc(criteriaText(m.criteria).replace("전체 로그", "모든 서버 · 전체 기록"))}</p>
    ${nodes
      ? `<div class="chips"><button class="chip" data-src="${i}:0" aria-pressed="${on}" aria-controls="panel">${icon("server", "sm")}<span>서버 ${nodes}대 · 기록 ${m.evidence.length}줄</span><span class="open">${on ? "표시 중" : "기록 보기"}</span></button></div>`
      : `<p class="note">조건에 맞는 서버가 없습니다.</p>`}
  </div>`;
}

function renderServerAskPanel(m, i) {
  const f = m.facts;
  const levels = Object.entries(f["마지막 판정 등급별 노드 수"] || {}).map(([k, n]) => `${k} ${n}`).join(" · ") || "—";
  const nodes = Object.entries(f["노드별"] || {}).map(([node, r]) => {
    const judged = Object.entries(r["판정"]).map(([k, n]) => `${k} ${n}`).join(" · ") || "판정 없음";
    return [node, `수집 ${r["수집"]} · 바뀐 설정 ${r["바뀐 설정"]} · 서버 점검 ${judged}`];
  });
  $("panel").innerHTML = `<div class="panel-head"><h3>근거 기록</h3>${CLOSE_BTN}</div>
    <div class="panel-body">
      <p class="subject">${esc(criteriaText(m.criteria).replace("전체 로그", "모든 서버 · 전체 기록"))}</p>
      <div class="meta">Q${i + 1} · ${esc(m.q)}</div>
      <div class="sec"><h4>${icon("activity", "sm")}집계</h4>${kvTable([
        ["서버", `${f["노드 수"]}대`], ["마지막 판정", levels],
        ["기간 안 수집", f["기간 안 첫 수집"] ? `${stamp(f["기간 안 첫 수집"])} ~ ${stamp(f["기간 안 마지막 수집"])}` : "없음"], ...nodes])}</div>
      <div class="sec"><h4>${icon("file", "sm")}바뀐 설정 · 서버 점검 기록</h4>${m.evidence.length
        ? `<div class="box pre">${esc(m.evidence.join("\n"))}</div>` : `<p class="note">기간 안에 바뀐 설정 · 서버 점검이 없습니다.</p>`}</div>
      <p class="note">숫자는 코어가 수집 · 서버 점검 기록에서 직접 센 값입니다. 서버마다 지금 상태는 정책 관리 → [노드]에서 봅니다.</p>
    </div>`;
}

// 인용 조항 패널은 열어 둔 근거가 있을 때만 자리를 차지합니다.
function syncCite() {
  document.querySelector(".workspace").classList.toggle("cite", state.mainTab === "ask" && !!state.askSource);
}

function renderAskPanel() {
  const sel = state.askSource;
  const m = sel && asks()[sel.i];
  if (m && askMode() === "log") { renderLogPanel(m, sel.i); return; }
  if (m && askMode() === "server") { renderServerAskPanel(m, sel.i); return; }
  const source = m && m.sources[sel.n];
  $("panel").innerHTML = `<div class="panel-head"><h3>인용 조항 원문</h3>${CLOSE_BTN}</div>
    <div class="panel-body">${source
      ? `<p class="subject">${esc(chipLabel(source))}</p>
        <div class="meta">Q${sel.i + 1} · ${esc(m.q)}</div>
        <div class="sec"><h4>${icon("book", "sm")}기준 문서 원문</h4><div class="clause">${esc(clauseText(source))}</div></div>
        <p class="note">모델이 밝힌 근거 문서에서 해당 조항을 잘라 보여줍니다.</p>`
      : ""}</div>`;
}

function renderLogPanel(m, i) {
  const f = m.facts;
  const rows = [
    ["해당 로그", `${f.count}건`],
    ["기간", `${stamp(f.first)} ~ ${stamp(f.last)}`],
    ...Object.entries(f.by_user).map(([u, n]) => [u, `${n}건`]),
    ...Object.entries(f.attribute_totals).map(([k, v]) => [`${k} 합계`, String(v)]),
  ];
  const more = f.count > m.evidence.length ? `<p class="note">최근 ${m.evidence.length}건만 표시합니다. 건수 · 합계는 전체 ${f.count}건 기준입니다.</p>` : "";
  $("panel").innerHTML = `<div class="panel-head"><h3>근거 로그</h3>${CLOSE_BTN}</div>
    <div class="panel-body">
      <p class="subject">${esc(criteriaText(m.criteria))}</p>
      <div class="meta">Q${i + 1} · ${esc(m.q)}</div>
      <div class="sec"><h4>${icon("activity", "sm")}집계</h4><div class="box"><table class="kv">
        ${rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table></div></div>
      <div class="sec"><h4>${icon("file", "sm")}로그</h4><div class="box pre">${esc(m.evidence.join("\n"))}</div>${more}</div>
      <p class="note">숫자는 코어가 로그에서 직접 센 값입니다.</p>
    </div>`;
}

async function ask(text) {
  const q = text.trim();
  if (!q || asks().some((m) => m.started)) return;
  $("ask-input").value = "";
  await runAsk(q, () => getJSON(ASK[askMode()].url, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }),
  }));
}

// 질의 기록은 내 것만 옵니다. 메뉴마다 따로라 정책 질의 · 서버 질의 · 로그 질의를 나눠 받습니다.
async function loadAsks() {
  state.asks = { policy: [], server: [], log: [] };
  if (!roleViews().some((v) => RESULT_VIEWS.has(v))) return;
  const toItem = (r) => ({ q: r.question, answer: r.answer, sources: r.sources, criteria: r.criteria, facts: r.facts, evidence: r.evidence, failed: r.failed });
  const [policy, servers, logs] = await Promise.all(["policy", "servers", "logs"].map((k) => getJSON(`/api/qa?kind=${k}`)));
  state.asks = { policy: policy.map(toItem), server: servers.map(toItem), log: logs.map(toItem) };
}

async function runAsk(q, fetchAnswer) {
  const m = { q, started: Date.now() };
  asks().push(m);
  renderAsk();
  $("ask-log").scrollTop = $("ask-log").scrollHeight;
  const timer = setInterval(() => { const el = $("ask-wait"); if (el) el.textContent = askWaitLabel(m); }, 1000);
  try {
    Object.assign(m, await fetchAnswer());
  } catch (e) {
    Object.assign(m, { answer: `질의 실패: ${e.message}`, sources: [], failed: true });
  } finally {
    clearInterval(timer);
    m.started = null;
    renderAsk();
    $("ask-log").scrollTop = $("ask-log").scrollHeight;
  }
}

function renderAskExamples() {
  const examples = ASK[askMode()].examples;
  $("ask-ex").innerHTML = `<span class="label">예시</span>` +
    examples.map((q, n) => `<button type="button" data-n="${n}">${esc(q)}</button>`).join("");
  $("ask-ex").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => ask(examples[Number(b.dataset.n)])));
}

$("ask-form").addEventListener("submit", (e) => { e.preventDefault(); ask($("ask-input").value); });

/* ── 분석 실행 — 코어 작업(/api/jobs)을 돌리고 끝날 때까지 진행 상황을 봅니다 ── */
// 화면에서 돌리는 분석은 정책 관리 검토뿐입니다. 로그 감시는 서버가 정해진 간격마다 스스로 돌립니다.
const VIEW_KIND = { policies: "policies" };
let jobTimer = null;

function runKindLabel() {
  const kinds = (state.jobs && state.jobs.kinds) || {};
  return `${kinds[VIEW_KIND[state.view]] || "분석"} 실행`;
}

function renderRun() {
  const j = state.jobs;
  // 노드 탭의 [지금 점검]도 같은 작업 큐를 씁니다. 다른 작업이 돌면 기다립니다.
  $("check-now").disabled = !j || !!j.running;
  $("check-now-txt").textContent = j && j.running === "nodes" ? `점검 중…${j.total ? ` ${j.done}/${j.total}` : ""}` : "지금 점검";
  const btn = $("run"), txt = $("run-txt");
  // 분석 실행은 정책 관리 · 로그 감시만 합니다. 권한 신청은 들어오면 바로 판정됩니다.
  btn.hidden = !VIEW_KIND[state.view];
  if (btn.hidden) return;
  if (!j) { btn.disabled = true; txt.textContent = "분석 실행 불가"; return; }
  btn.disabled = !!j.running;
  if (j.running) {
    const name = j.kinds[j.running] || j.running;
    txt.textContent = `${name}${j.auto ? "(자동)" : ""} 중…${j.total ? ` ${j.done}/${j.total}` : ""}`;
  } else {
    txt.textContent = runKindLabel();
  }
  // 정책 관리 검토가 문서 · 규칙 적재까지 하고 서버 점검은 하지 않는다는 것이 버튼만 봐서는 보이지 않아 툴팁에 둡니다.
  btn.dataset.tip = VIEW_KIND[state.view] === "policies"
      ? `${runKindLabel()}|기준 문서 · 솔루션 정책을 RAG 에 맞추고 정책 간 중복 · 충돌 · 과도한 허용을 찾습니다. 서버 점검은 수집 노드가 보낸 것을 서버가 주기적으로 합니다`
      : `${runKindLabel()}|수 분 걸릴 수 있습니다`;
}

async function startJob(kind = VIEW_KIND[state.view]) {
  try {
    state.jobs = await getJSON(`/api/jobs/${kind}`, { method: "POST" });
  } catch (e) {
    alert(`분석을 시작하지 못했습니다: ${e.message}`);
  }
  watchJobs(true);
}

// 빠른 로그 감시는 따로 돌아 running 에 나오지 않습니다. 끝난 시각이 바뀌면 결과를 다시 받습니다.
const fastDone = () => (state.jobs && state.jobs.fast && (state.jobs.fast.last.events_fast || {}).finished_at) || null;
const fastEvery = () => {
  const s = state.jobs && state.jobs.fast;
  return s && s.every_min ? `${s.every_min}분마다` : "짧은 간격으로";
};

// 작업이 끝나면 저장된 결과를 다시 받아 화면 전체를 갱신합니다.
// 파일이 없을 때처럼 시작하자마자 끝난 작업도 결과 · 실패를 보여줘야 하므로 started 면 바로 갱신합니다.
function watchJobs(started = false) {
  clearInterval(jobTimer);
  renderRun();
  const refresh = async () => {
    state.results = await getJSON("/api/results");
    renderAll();
    if (state.mainTab === "nodes") loadNodes();
  };
  if (!roleViews().some((v) => RESULT_VIEWS.has(v))) return;
  if (!state.jobs || !state.jobs.running) {
    if (started) refresh();
    // 자동 감시는 화면이 시작하지 않으므로 쉬는 동안에도 가끔 보고, 돌기 시작하면 따라갑니다.
    jobTimer = setInterval(async () => {
      const before = fastDone();
      try { state.jobs = await getJSON("/api/jobs"); } catch (e) { return; }
      renderRun();
      if (state.jobs.running) { watchJobs(); return; }
      if (fastDone() !== before) refresh();
    }, 30000);
    return;
  }
  jobTimer = setInterval(async () => {
    try { state.jobs = await getJSON("/api/jobs"); } catch (e) { return; }
    renderRun();
    if (state.jobs.running) return;
    clearInterval(jobTimer);
    refresh();
  }, 2000);
}

$("run").addEventListener("click", () => startJob());
$("check-now").addEventListener("click", () => startJob("nodes"));

/* ── 수집 노드 — 화면에서 노드를 등록해 키를 발급하고, 상태 · 키를 보고 끄거나 키를 다시 발급합니다 ── */
function nodeState(n) {
  if (!n.enabled) return ["off", "꺼짐", "보내도 받지 않고 주기 점검에서도 빠집니다"];
  if (!n.key_issued) return ["wait", "키 없음", "손으로 넣은 수집뿐입니다. 키를 발급해 노드에 넣으면 직접 보낼 수 있습니다"];
  if (n.stale) return ["stale", "끊김", `${n.interval_min}분 간격인데 세 번 넘게 소식이 없습니다`];
  if (!n.last_collected_at) return ["wait", "기다리는 중", "키를 발급했지만 아직 받은 수집이 없습니다"];
  return ["on", "수집 중", `${n.interval_min || "?"}분마다`];
}

async function loadNodes() {
  try { state.nodes.list = await getJSON("/api/nodes"); state.nodes.error = ""; } catch (e) { state.nodes.error = e.message; }
  renderNodes();
  if (state.nodes.selected) await loadNodeDetail(state.nodes.selected); else if (state.mainTab === "nodes") renderPanel();
}

async function loadNodeDetail(name) {
  try { state.nodes.detail = await getJSON(`/api/nodes/${encodeURIComponent(name)}`); } catch (e) { state.nodes.detail = { error: e.message }; }
  if (state.mainTab === "nodes") renderPanel();
}

function renderNodes() {
  const N = state.nodes, list = N.list || [];
  $("node-count").textContent = N.list ? `${list.length}대` : "";
  const rows = $("node-rows");
  if (N.error) { rows.innerHTML = `<tr><td colspan="5" class="empty">노드 목록을 받지 못했습니다: ${esc(N.error)}</td></tr>`; return; }
  if (!N.list) { rows.innerHTML = `<tr><td colspan="5" class="empty">불러오는 중…</td></tr>`; return; }
  if (!list.length) {
    rows.innerHTML = `<tr><td colspan="5" class="empty">아직 등록된 노드가 없습니다.<br>[노드 등록]으로 서버마다 키를 발급하고, 그 서버에 node/install.sh 로 노드를 까세요.</td></tr>`;
    return;
  }
  rows.innerHTML = list.map((n) => {
    const [cls, label, tip] = nodeState(n);
    return `<tr data-node="${esc(n.name)}" tabindex="0" aria-current="${n.name === N.selected}">
      <td class="lwho">${esc(n.name)}</td><td>${esc(n.host)}${n.ip && n.ip !== n.host ? ` (${esc(n.ip)})` : ""}</td>
      <td><span class="nstate ${cls}" data-tip="${esc(`${label}|${tip}`)}">${label}</span></td>
      <td class="col-sol when">${esc(stamp(n.last_collected_at))}</td>
      <td>${n.level ? `<i class="ldot ${n.level}"></i>${esc(n.level)}` : `<span class="note">${n.last_collected_at ? "점검 대기" : ""}</span>`}</td></tr>`;
  }).join("");
}

function pickNode(name) {
  Object.assign(state.nodes, { selected: name, detail: null, adding: false });
  state.panelMsg = "";
  renderNodes();
  renderPanel();
  openDrawer();
  loadNodeDetail(name);
}
$("node-rows").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-node]"); if (tr) pickNode(tr.dataset.node); });
$("node-rows").addEventListener("keydown", (e) => {
  const tr = e.target.closest("tr[data-node]");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pickNode(tr.dataset.node); }
});

$("add-node").addEventListener("click", () => {
  Object.assign(state.nodes, { selected: null, detail: null, adding: true });
  state.panelMsg = "";
  renderNodes();
  renderPanel();
  openDrawer();
  const input = $("node-name");
  if (input) input.focus();
});

async function createNode(name) {
  try {
    const made = await send("/api/nodes", { name });
    Object.assign(state.nodes, { adding: false, selected: made.name, detail: null });
    state.panelMsg = "✓ 노드를 등록하고 키를 발급했습니다";
  } catch (e) {
    state.panelMsg = e.message;
    renderPanel();
    return;
  }
  await loadNodes();
}

async function nodeAction(name, action) {
  const issuing = action === "key";
  if (issuing && !confirm(`${name} 의 키를 새로 발급합니다. 지금 키는 바로 못 쓰게 되어, 그 서버의 node.conf 를 새 키로 바꿔야 다시 보냅니다. 계속할까요?`)) return;
  try {
    if (issuing) {
      await send(`/api/nodes/${encodeURIComponent(name)}/key`, {});
      state.panelMsg = "✓ 키를 새로 발급했습니다. 그 서버의 node.conf 를 바꾸세요";
    } else {
      await send(`/api/nodes/${encodeURIComponent(name)}`, { enabled: action === "on" }, "PATCH");
      state.panelMsg = action === "on" ? "✓ 노드를 켰습니다" : "✓ 노드를 껐습니다";
    }
  } catch (e) {
    state.panelMsg = e.message;
  }
  await loadNodes();
}

// 내부망 서비스라 노드 키를 언제든 다시 보여줍니다. 해시만 남은 예전 키는 다시 발급해야 보입니다.
function nodeKey(n, d) {
  if (!d || d.error || !n.key_issued) return "";
  if (!d.key) return `<div class="sec"><h4>${icon("lock", "sm")}노드 키</h4><p class="note">예전 방식으로 발급해 볼 수 없는 키입니다. [키 다시 발급]을 하면 여기에 보입니다.</p></div>`;
  const cmd = `sudo sh node/install.sh --server ${location.origin} --key ${d.key}`;
  return `<div class="sec"><h4>${icon("lock", "sm")}노드 키</h4><div class="key-box">
      <input id="issued-key" readonly value="${esc(d.key)}" aria-label="노드 키">
      <p class="note">점검할 서버에서:</p><div class="box pre">${esc(cmd)}</div>
      <div class="node-actions"><button class="rerun" data-copy="${esc(d.key)}">키 복사</button><button class="rerun" data-copy="${esc(cmd)}">설치 명령 복사</button></div>
    </div></div>`;
}

// 사내망의 http 화면에서는 클립보드 API 를 못 쓸 수 있어, 그때는 키 칸을 골라 둡니다 (Ctrl+C).
async function copyText(text, button) {
  try { await navigator.clipboard.writeText(text); button.textContent = "복사했습니다"; }
  catch (e) { const input = $("issued-key"); input.focus(); input.select(); button.textContent = "Ctrl+C 로 복사하세요"; }
}

/* ── 로그 조회 — 거르기 · 세기는 코어가 합니다. 화면은 조건을 넘기고 받은 그대로 보여줍니다 ── */
const PERIOD_LABEL = { day: "하루", week: "일주일", month: "한 달", quarter: "3개월", half: "6개월", year: "1년", all: "전체" };
const LOG_FILTERS = [["user", "log-user", "전체 사용자", "users"], ["solution", "log-solution", "전체 솔루션", "solutions"], ["how", "log-how", "전체 행위", "how"]];
let logsSeq = 0;

// 늦게 온 응답이 새 조건의 결과를 덮지 않게 마지막 요청만 받습니다.
async function loadLogs() {
  const L = state.logs, seq = ++logsSeq;
  L.loading = true;
  renderLogs();
  const params = new URLSearchParams({ period: L.period, page: L.page });
  LOG_FILTERS.forEach(([k]) => { if (L[k]) params.set(k, L[k]); });
  let data = null, error = "";
  try { data = await getJSON(`/api/logs?${params}`); } catch (e) { error = e.message; }
  if (seq !== logsSeq) return;
  Object.assign(L, { data: data || L.data, error, loading: false, selected: null });
  renderLogs();
  if (state.mainTab === "logs") renderPanel();
}

// 다른 화면(로그 감시 판정)에서 조건을 정해 엽니다.
/* ── 보안 통계 — 줄마다 운영자가 이어 볼 곳(판정 · 노드 · 신청)을 패널에 둡니다 ── */
const STAT_PERIODS = { week: "일주일", month: "한 달", quarter: "3개월", all: "전체" };
const levelsText = (o) => ["위험", "주의", "정상", "판정 실패", "판정 없음"].filter((k) => o[k]).map((k) => `${k} ${o[k]}`).join(" · ") || "—";

const STAT_KINDS = { stats: "/api/stats", ustats: "/api/user-stats" };
const STAT_TITLES = { stats: "보안 통계", ustats: "사용자 위협" };
// 신뢰 구간 → 막대 색 (등급 색을 빌려 씁니다 — 낮음 = 위험 색)
const TRUST_COLOR = { "낮음": "위험", "보통": "주의", "높음": "정상" };
const isStatTab = (tab) => tab in STAT_KINDS;

async function loadStats() {
  const S = state.stats, kind = isStatTab(state.mainTab) ? state.mainTab : "stats";
  if (S.kind !== kind) Object.assign(S, { kind, data: null, selected: null });
  S.loading = true; renderStatsView();
  try { S.data = await getJSON(`${STAT_KINDS[kind]}?period=${S.period}`); S.error = ""; }
  catch (e) { S.error = e.message; }
  S.loading = false;
  renderStatsView();
  renderPanel();
}

function statRow(kind, key, cells) {
  const on = state.stats.selected && state.stats.selected.kind === kind && state.stats.selected.key === key;
  return `<tr data-kind="${kind}" data-key="${esc(key)}" tabindex="0" aria-current="${on}">${cells.map((c) => `<td>${c}</td>`).join("")}</tr>`;
}

function statTable(head, rows, empty) {
  return rows.length
    ? `<div class="ltable-wrap"><table class="ltable"><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`
    : `<p class="sub">${empty}</p>`;
}

const pct = (n, d) => (d ? `${Math.round((n / d) * 1000) / 10}%` : "—");


function periodDays(d) {
  if (d.period !== "all") return { week: 7, month: 30, quarter: 90 }[d.period];
  const days = Object.keys(d.logs.days).sort();
  return days.length ? Math.max(1, Math.round((Date.now() - new Date(days[0])) / 86400000)) : 0;
}

const LEVEL_SEGS = ["위험", "주의", "정상"];

// 가로 막대 — 줄마다 고르면 패널이 열립니다. segs = [[등급, 값]], max = 막대 길이의 기준 (비율이면 그 줄의 합).
function hbars(kind, rows, { max, value } = {}) {
  const top = max || Math.max(1, ...rows.map((r) => r.segs.reduce((a, [, v]) => a + v, 0)));
  return `<div class="hbars">${rows.map((r) => {
    const sum = r.segs.reduce((a, [, v]) => a + v, 0), base = r.base || top;
    const on = state.stats.selected && state.stats.selected.kind === kind && state.stats.selected.key === r.key;
    const tip = `${r.label}|${r.segs.filter(([, v]) => v).map(([k, v]) => `${k} ${v}`).join(" · ") || "없음"}${r.extra ? ` · ${r.extra}` : ""}`;
    return `<div class="hbar" data-kind="${kind}" data-key="${esc(r.key)}" aria-current="${on}">
      <span class="lbl">${esc(r.label)}</span>
      <span class="track" tabindex="0" data-tip="${esc(tip)}"><span class="bar" style="width:${base ? (sum / base) * 100 : 0}%">${r.segs.filter(([, v]) => v)
        .map(([k, v]) => `<span class="mk ${k}" style="flex:${v} 1 0"></span>`).join("")}</span></span><span class="val">${esc(value ? value(r) : String(sum))}</span>
    </div>`;
  }).join("")}</div>`;
}

function legend(items, round) {
  return `<div class="legend">${items.map(([k, label]) => `<span><i class="mk ${k}${round ? " round" : ""}"></i>${esc(label)}</span>`).join("")}</div>`;
}

const tableView = (html) => (html ? `<details class="tableview"><summary>표로 보기</summary>${html}</details>` : "");
const meter = (segs, total) => `<div class="meter">${segs.filter(([, v]) => v).map(([k, v]) => `<span class="mk ${k}" style="width:${total ? (v / total) * 100 : 0}%"></span>`).join("")}</div>`;

function periodDays(d) {
  if (d.period !== "all") return { week: 7, month: 30, quarter: 90 }[d.period];
  const days = Object.keys(d.logs.days).sort();
  return days.length ? Math.max(1, Math.round((Date.now() - new Date(days[0])) / 86400000)) : 0;
}

function niceMax(n) {
  const step = Math.pow(10, Math.floor(Math.log10(Math.max(n, 1))));
  return Math.ceil(n / step) * step;
}

function renderStatsView() {
  const S = state.stats, d = S.data;
  $("stat-periods").innerHTML = Object.entries(STAT_PERIODS).map(([k, label]) =>
    `<button data-period="${k}" aria-pressed="${k === S.period}">${label}</button>`).join("");
  $("stat-range").textContent = S.loading ? "세는 중…" : S.error ? S.error : d ? (d.since ? `${stamp(d.since)} 부터` : "처음부터") : "";
  $("view-stats").style.opacity = S.loading && d ? ".55" : "";
  const users = S.kind === "ustats";
  $("stat-title").textContent = STAT_TITLES[S.kind || "stats"];
  $("stat-servers").hidden = users;
  $("stat-requests").hidden = !users;
  $("stat-trust").hidden = !users;
  if (!d) { ["stat-tiles", "stat-trust", "stat-events", "stat-servers", "stat-requests"].forEach((id) => { $(id).innerHTML = ""; }); return; }
  if (users) { renderUserStats(d); return; }

  const ev = d.events, L = ev.lines, threat = L["주의"] + L["위험"], logs = d.logs.count;
  const days = periodDays(d);
  const sv = d.servers, gaps = sv.nodes.reduce((a, n) => ({ 위험: a["위험"] + n.threats["위험"], 주의: a["주의"] + n.threats["주의"] }), { 위험: 0, 주의: 0 });

  // 날짜별 — 위험 · 주의 · 그 외 로그를 쌓은 세로 막대. 높이 = 그날 로그 건수(빈도), 색 조각 = 위협 비율
  const byDay = {};
  Object.entries(d.logs.days).forEach(([day, n]) => { byDay[day] = { 위험: 0, 주의: 0, total: n }; });
  ev.days.forEach((x) => { byDay[x.day] = { ...(byDay[x.day] || { total: 0 }), 위험: x["위험"], 주의: x["주의"] }; });
  const dayKeys = Object.keys(byDay).sort();
  const dayMax = niceMax(Math.max(1, ...dayKeys.map((k) => Math.max(byDay[k].total, byDay[k]["위험"] + byDay[k]["주의"]))));
  const spark = dayKeys.map((k) => byDay[k]);

  const tile = (label, big, note, extra = "") => `<div class="tile"><span class="label">${label}</span><span class="big">${big}</span>${extra}<p class="note">${note}</p></div>`;
  const peak = ev.days.reduce((a, x) => (x["주의"] + x["위험"] > (a ? a["주의"] + a["위험"] : 0) ? x : a), null);
  $("stat-tiles").innerHTML = [
    tile("위협 로그 비율", logs == null ? "—" : pct(threat, logs), logs == null ? "로그를 읽지 못했습니다" : `${threat} / ${logs}건 · 위험 ${L["위험"]} · 주의 ${L["주의"]}`,
      logs ? meter([["위험", L["위험"]], ["주의", L["주의"]]], logs) : ""),
    tile("위협 로그 빈도", days ? `하루 ${Math.round((threat / days) * 10) / 10}건` : "—", peak ? `가장 많은 날 ${esc(peak.day)} ${peak["주의"] + peak["위험"]}건` : "주의 · 위험 로그 없음",
      spark.length > 1 ? `<svg viewBox="0 0 ${spark.length * 4} 24" preserveAspectRatio="none" style="width:100%;height:24px;margin-top:4px" aria-hidden="true"><polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${spark.map((x, n) => `${n * 4 + 2},${22 - ((x["위험"] + x["주의"]) / Math.max(1, ...spark.map((y) => y["위험"] + y["주의"]))) * 20}`).join(" ")}"/></svg>` : ""),
    tile("위험 판정 로그", `${L["위험"]}건`, `위험 판정에 묶인 로그 · 주의 ${L["주의"]}건`, logs ? meter([["위험", L["위험"]]], logs) : ""),
    tile("노드 위협 항목", `${gaps["위험"] + gaps["주의"]}건`, `위험 ${gaps["위험"]} · 주의 ${gaps["주의"]} · 위험 항목이 있는 서버 ${sv.nodes.filter((n) => n.threats["위험"]).length} / ${sv.nodes.length}대`,
      gaps["위험"] + gaps["주의"] ? meter([["위험", gaps["위험"]], ["주의", gaps["주의"]]], gaps["위험"] + gaps["주의"]) : ""),
  ].join("");

  const cols = dayKeys.map((k) => {
    const x = byDay[k], other = Math.max(0, x.total - x["위험"] - x["주의"]);
    const h = (v) => `${(v / dayMax) * 100}%`;
    return `<span class="col" tabindex="0" data-tip="${esc(k)}|로그 ${x.total}건 · 위험 ${x["위험"]} · 주의 ${x["주의"]} (${pct(x["위험"] + x["주의"], x.total)})"><span class="stack">${
      [["위험", x["위험"]], ["주의", x["주의"]], ["기타", other]].filter(([, v]) => v).map(([c, v]) => `<span class="mk ${c}" style="height:${h(v)}"></span>`).join("")}</span></span>`;
  }).join("");
  // 날짜 글자는 그 막대 칸 가운데에 둡니다 (처음 · 가운데 · 끝).
  const at = (n) => `${((n + 0.5) / dayKeys.length) * 100}%`;
  const ticks = [...new Set([0, Math.floor(dayKeys.length / 2), dayKeys.length - 1])];
  $("stat-events").innerHTML = `
    <div class="logs-head"><h3>위협 로그 — 비율 · 빈도</h3><span class="logs-count">위협 로그 ${threat} / ${logs ?? "—"}건</span></div>
    <p class="sub">막대 높이 = 그날 로그 건수, 색 조각 = 주의 · 위험 판정에 묶인 로그. 로그 감시는 사용자별로 묶어 판정하므로 그 묶음의 줄을 셉니다.</p>
    ${dayKeys.length ? `<div class="chart"><div class="cols" role="img" aria-label="날짜별 로그 건수와 주의 · 위험 로그">
        ${[1, 0.5].map((f) => `<span class="grid" style="bottom:${f * 100}%"><span>${Math.round(dayMax * f)}</span></span>`).join("")}${cols}</div>
      <div class="xaxis">${ticks.map((n, i) => `<span style="left:${i === 0 ? "0" : i === ticks.length - 1 ? "100%" : at(n)}">${esc(dayKeys[n])}</span>`).join("")}</div></div>
      ${legend([["위험", "위험"], ["주의", "주의"], ["기타", "그 외 로그"]])}` : `<p class="sub">이 기간에 로그가 없습니다.</p>`}
    ${tableView(statTable(["날짜", "로그", "위험", "주의", "비율"], dayKeys.map((k) => `<tr><td>${esc(k)}</td><td class="num">${byDay[k].total}</td><td class="num">${byDay[k]["위험"]}</td><td class="num">${byDay[k]["주의"]}</td><td class="num">${pct(byDay[k]["위험"] + byDay[k]["주의"], byDay[k].total)}</td></tr>`), ""))}`;

  // 노드 위협 데이터 — 모듈별 위협 항목 · 노드별 항목 · 서버 점검 등급 흐름(점) · 걸린 조항
  // 점검은 기간 끝에 몰려 있기 쉬워 기간 시작이 아니라 첫 점검부터 지금까지를 폭으로 씁니다. 앞뒤로 조금 띄워 점이 가장자리에 붙지 않게 합니다.
  const times = sv.nodes.flatMap((n) => n.grades.map((g) => new Date(g.at).getTime()));
  const first = times.length ? Math.min(...times) : Date.now();
  const pad = Math.max(60000, (Date.now() - first) * 0.04);
  const t0 = first - pad, span = Date.now() + pad - t0;
  const strips = sv.nodes.filter((n) => n.grades.length).map((n) => {
    const on = state.stats.selected && state.stats.selected.kind === "node" && state.stats.selected.key === n.node;
    return `<div class="hbar" data-kind="node" data-key="${esc(n.node)}" aria-current="${on}"><span class="lbl">${esc(n.node)}</span>
      <span class="track"><span class="strip" style="flex:1">${n.grades.map((g) => `<span class="dot ${g.level}" tabindex="0" style="left:${((new Date(g.at).getTime() - t0) / span) * 100}%" data-tip="${esc(n.node)}|${esc(stamp(g.at))} ${g.level}"></span>`).join("")}</span></span>
      <span class="val">${n.trend}</span></div>`;
  }).join("");
  $("stat-servers").innerHTML = `
    <div class="logs-head"><h3>노드 위협 데이터</h3><span class="logs-count">서버 ${sv.nodes.length} · 위협 항목 ${gaps["위험"] + gaps["주의"]}</span></div>
    <p class="sub">수집 노드가 읽어 온 설정을 서버 점검이 기준 문서와 비교해 찾은 '정책과 다른 곳'. 항목 · 조항은 노드마다 기간 안 마지막 점검만 셉니다.</p>
    ${sv.modules.length ? `<p class="chart-title">모듈별 위협 항목</p><div class="chart">${hbars("module", sv.modules.map((m) => ({
        key: m.module, label: m.module, segs: [["위험", m["위험"]], ["주의", m["주의"]]], extra: `걸린 서버 ${m.nodes.join(", ")}` })),
        { value: (r) => { const m = sv.modules.find((x) => x.module === r.key); return `${m["위험"] + m["주의"]}건 · 서버 ${m.nodes.length}`; } })}</div>` : `<p class="sub">이 기간 서버 점검에서 찾은 위협 항목이 없습니다.</p>`}
    ${sv.nodes.length ? `<p class="chart-title">노드별 위협 항목</p><div class="chart">${hbars("node", sv.nodes.map((n) => ({
        key: n.node, label: n.node, segs: [["위험", n.threats["위험"]], ["주의", n.threats["주의"]]], extra: `마지막 등급 ${n.level || "판정 없음"} · 설정이 바뀐 수집 ${n.changed} / ${n.collected}` })),
        { max: Math.max(1, ...sv.nodes.map((n) => n.threats["위험"] + n.threats["주의"])), value: (r) => { const n = sv.nodes.find((x) => x.node === r.key); return `${n.threats["위험"] + n.threats["주의"]}건 · ${n.level || "판정 없음"}`; } })}</div>
      ${legend([["위험", "위험"], ["주의", "주의"]])}` : ""}
    ${strips ? `<p class="chart-title">서버 점검 등급 흐름 <span class="note" style="font-weight:400">— 점 하나가 점검 한 번, 왼쪽 ${esc(stamp(new Date(first).toISOString()))} ~ 오른쪽 지금</span></p><div class="chart"><div class="hbars">${strips}</div></div>
      ${legend(LEVEL_SEGS.map((k) => [k, k]), true)}` : ""}
    ${sv.clauses.length ? `<p class="chart-title">걸린 조항 — 걸린 서버 수</p><div class="chart">${hbars("clause", sv.clauses.map((c) => ({
        key: c.source, label: chipLabel(c.source), segs: [["기타", c.nodes.length]], extra: `${c.nodes.join(", ")} · 항목 ${c.items.length}` })),
        { max: Math.max(1, sv.nodes.length), value: (r) => { const c = sv.clauses.find((x) => x.source === r.key); return `서버 ${c.nodes.length} · 항목 ${c.items.length}`; } })}</div>` : ""}
    ${tableView(statTable(["노드", "마지막 등급", "위험", "주의", "등급 흐름", "설정이 바뀐 수집"], sv.nodes.map((n) => statRow("node", n.node, [esc(n.node), n.level || "판정 없음",
      `<span class="num">${n.threats["위험"]}</span>`, `<span class="num">${n.threats["주의"]}</span>`, esc(n.grades.map((g) => g.level).join(" → ")), `<span class="num">${n.changed} / ${n.collected}</span>`])), "")
      + statTable(["모듈", "위험", "주의", "걸린 서버"], sv.modules.map((m) => `<tr><td>${esc(m.module)}</td><td class="num">${m["위험"]}</td><td class="num">${m["주의"]}</td><td>${esc(m.nodes.join(", "))}</td></tr>`), "")
      + statTable(["근거 조항", "걸린 서버", "항목"], sv.clauses.map((c) => `<tr><td>${esc(chipLabel(c.source))}</td><td>${esc(c.nodes.join(", "))}</td><td class="num">${c.items.length}</td></tr>`), ""))}`;
}

// 사용자 위협 — 사용자별 위협 로그(로그 감시)와 부서 · 권한별 신청 위험도(권한 신청). 위협 예측은 이 화면에 더할 예정입니다.
function renderUserStats(d) {
  const ev = d.events, rq = d.requests, ai = rq.ai || {}, judged = rq.total - (ai["판정 없음"] || 0);
  const repeat = ev.users.filter((u) => u["위험"] + u["주의"] > 1).length;
  const tile = (label, big, note, extra = "") => `<div class="tile"><span class="label">${label}</span><span class="big">${big}</span>${extra}<p class="note">${note}</p></div>`;
  $("stat-tiles").innerHTML = [
    tile("위협 사용자", `${ev.users.length}명`, `주의 · 위험 판정을 받은 사용자 · 위험 ${ev.users.filter((u) => u["위험"]).length}명`),
    tile("신뢰 낮음", `${(d.trust || []).filter((p) => p.band === "낮음").length}명`, `신뢰 수치 70점 미만 · 보통 ${(d.trust || []).filter((p) => p.band === "보통").length}명 · 반복 위협 ${repeat}명`),
    tile("신청 중 위험 비율", pct(ai["위험"] || 0, judged), `위험 ${ai["위험"] || 0} · 주의 ${ai["주의"] || 0} / 판정 ${judged}건`,
      judged ? meter([["위험", ai["위험"] || 0], ["주의", ai["주의"] || 0], ["정상", ai["정상"] || 0]], judged) : ""),
    tile("AI와 결재가 엇갈린 신청", `${rq.mismatches.length}건`, "AI 위험인데 승인 · AI 정상인데 반려"),
  ].join("");
  // 신뢰 수치 — 코드 규칙으로 100점에서 깎은 값 (data/trust.py). 낮은 순, 막대 색은 신뢰 구간
  const trust = d.trust || [];
  $("stat-trust").innerHTML = `
    <div class="logs-head"><h3>사용자 신뢰 수치</h3><span class="logs-count">${trust.length}명 · 낮은 순</span></div>
    <p class="sub">로그 감시 위험 · 주의 판정, 반복, 권한 신청의 AI 위험 · 주의 · 반려 · 회수마다 정해진 점수를 100점에서 깎습니다 (최근 30일 1배 · 90일 0.5배 · 그 전 0.25배). 먼저 살펴볼 사람을 고르는 참고값이고 결정은 사람이 합니다. 누르면 감점 내역과 AI 근거 요약.</p>
    ${trust.length ? `<div class="chart">${hbars("trust", trust.map((p) => ({
        key: p.key, label: `${p.department ? p.department + " " : ""}${p.name}`, segs: [[TRUST_COLOR[p.band], p.score]],
        extra: `신뢰 ${p.band} · 감점 ${p.deductions.length}건${p.linked ? "" : p.login_id ? " · 로그 ID 없음" : " · 계정 미연결"}` })),
        { max: 100, value: (r) => { const p = trust.find((x) => x.key === r.key); return `${p.score}점 · ${p.band}${p.linked ? "" : p.login_id ? " · 로그 ID 없음" : " · 계정 미연결"}`; } })}</div>
      ${legend([["위험", "낮음 (70 미만)"], ["주의", "보통 (70~89)"], ["정상", "높음 (90 이상)"]])}` : `<p class="sub">이 기간에 기록이 있는 사용자가 없습니다.</p>`}
    ${tableView(statTable(["사용자", "계정", "로그 사용자 ID", "신뢰 수치", "로그 위험 · 주의", "신청 · 위험 · 반려 · 회수"], trust.map((p) => statRow("trust", p.key, [
      esc(`${p.department ? p.department + " " : ""}${p.name}`), esc(p.login_id || "계정 미연결"), esc(p.log_id || "—"), `<span class="num">${p.score}</span> ${esc(p.band)}`,
      `<span class="num">${p.counts["로그 위험"]} · ${p.counts["로그 주의"]}</span>`, `<span class="num">${p.counts["신청"]} · ${p.counts["신청 위험"]} · ${p.counts["반려"]} · ${p.counts["회수"]}</span>`])), ""))}`;

  $("stat-events").innerHTML = `
    <div class="logs-head"><h3>사용자별 위협 로그</h3><span class="logs-count">사용자 ${ev.users.length}</span></div>
    <p class="sub">로그 감시가 주의 · 위험으로 판정한 묶음의 로그 줄을 사용자별로 셉니다. 2번 넘게 걸리면 "반복".</p>
    ${ev.users.length ? `<div class="chart">${hbars("user", ev.users.map((u) => ({
        key: u.user, label: u.user, segs: [["위험", u.line_levels["위험"]], ["주의", u.line_levels["주의"]]],
        extra: `판정 위험 ${u["위험"]} · 주의 ${u["주의"]}` })), { value: (r) => { const u = ev.users.find((x) => x.user === r.key); return `${u.lines}건${u["위험"] + u["주의"] > 1 ? " · 반복" : ""}`; } })}</div>` : ""}
    ${ev.users.length ? legend([["위험", "위험"], ["주의", "주의"]]) : `<p class="sub">이 기간에 주의 · 위험 판정을 받은 사용자가 없습니다.</p>`}
    ${tableView(statTable(["사용자", "위협 로그", "위험 판정", "주의 판정", "마지막 로그"], ev.users.map((u) => statRow("user", u.user, [esc(u.user), `<span class="num">${u.lines}</span>`,
      `<span class="num">${u["위험"]}</span>`, `<span class="num">${u["주의"]}</span>`, `<span class="when">${esc(stamp(u.last_at))}</span>`])), ""))}`;

  // 권한 신청 — 부서 · 권한별 AI 등급 구성(100% 막대). 막대 옆 = 정책 위반 소지(주의 · 위험) 비율
  const share = (kind, list) => hbars(kind, list.map((g) => {
    const n = g["신청"] - (g.ai["판정 없음"] || 0);
    return { key: g.name, label: g.name, base: n || 1, segs: LEVEL_SEGS.map((k) => [k, g.ai[k] || 0]),
             extra: `신청 ${g["신청"]} · 결재 ${Object.entries(g.outcome).map(([o, c]) => `${o} ${c}`).join(" · ")}` };
  }), { value: (r) => { const g = list.find((x) => x.name === r.key), n = g["신청"] - (g.ai["판정 없음"] || 0);
    return `위반 ${pct((g.ai["위험"] || 0) + (g.ai["주의"] || 0), n)} · 위험 ${pct(g.ai["위험"] || 0, n)} · ${g["신청"]}건`; } });
  $("stat-requests").innerHTML = `
    <div class="logs-head"><h3>권한 신청 — 부서별 정책 위반 · 위험 비율</h3><span class="logs-count">신청 ${rq.total} · ${esc(levelsText(ai))}</span></div>
    <p class="sub">막대 = AI 판정 구성 (판정 전 신청은 뺌). 정책 위반 소지 = 주의 · 위험 비율. 결재는 사람이 했습니다.</p>
    ${rq.departments.length ? `<p class="chart-title">부서별</p><div class="chart">${share("dept", rq.departments)}</div>
      <p class="chart-title">권한별</p><div class="chart">${share("access", rq.accesses)}</div>${legend(LEVEL_SEGS.map((k) => [k, k]))}` : `<p class="sub">이 기간에 신청이 없습니다.</p>`}
    ${rq.mismatches.length ? `<p class="sub" style="padding-top:10px">AI와 결재가 엇갈린 신청 ${rq.mismatches.length}건 — AI 위험인데 승인, 또는 AI 정상인데 반려</p>
      ${statTable(["신청", "신청자", "권한", "AI", "결재"], rq.mismatches.map((m) => statRow("mismatch", m.request_no, [
        esc(m.request_no), esc(m.requester), esc(m.access), `<i class="ldot ${m.ai}"></i>${m.ai}`, esc(m.outcome)])), "")}` : ""}
    ${tableView(statTable(["부서 · 권한", "신청", "위험", "주의", "정상", "결재 결과"], [...rq.departments, ...rq.accesses].map((g) => `<tr><td>${esc(g.name)}</td><td class="num">${g["신청"]}</td>${
      LEVEL_SEGS.map((k) => `<td class="num">${g.ai[k] || 0}</td>`).join("")}<td>${esc(Object.entries(g.outcome).map(([o, c]) => `${o} ${c}`).join(" · "))}</td></tr>`), ""))}`;

}

function renderStatsPanel() {
  const S = state.stats, d = S.data, sel = S.selected;
  const body = (title, subject, inner) => {
    $("panel").innerHTML = `<div class="panel-head"><h3>${esc(title)}</h3>${CLOSE_BTN}</div><div class="panel-body"><p class="subject">${esc(subject)}</p>${inner}</div>`;
  };
  if (!d || !sel) {
    body(STAT_TITLES[S.kind || "stats"], "막대 · 줄을 고르세요", `<p class="note">${S.kind === "ustats"
      ? "사용자 신뢰 수치 · 위협 로그 · 부서 · 권한 · 신청을 누르면 감점 내역 · AI 근거 요약과 이어 볼 곳(로그 조회 · 로그 감시 판정 · 결재함)이 나옵니다."
      : "모듈 · 노드 · 조항을 누르면 그 내용과 이어 볼 곳(노드 탭 · 기준 문서 원문)이 나옵니다."}</p>`);
    return;
  }
  if (sel.kind === "user") {
    const u = d.events.users.find((x) => x.user === sel.key);
    if (!u) return body("보안 통계", "기간 안에 없는 사용자입니다", "");
    body("위협 로그 사용자", u.user, `${kvTable([["위협 로그", `${u.lines}건`], ["위험 판정", `${u["위험"]}건`], ["주의 판정", `${u["주의"]}건`], ["마지막 로그", stamp(u.last_at)]])}
      <div class="sec"><button class="rerun" id="stat-go">${icon("search", "sm")}이 사용자의 로그 조회 (${STAT_PERIODS[S.period]})</button>
      <button class="rerun" id="stat-go2">${icon("list", "sm")}로그 감시 판정 보기</button></div>`);
    $("stat-go").addEventListener("click", () => { setView("events"); openLogs({ user: u.user, period: S.period === "all" ? "all" : S.period }); });
    $("stat-go2").addEventListener("click", () => { setView("events"); setMainTab("queue"); state.selected = `event:${u.keys[u.keys.length - 1]}`; renderRows(); renderPanel(); });
    return;
  }
  if (sel.kind === "node") {
    const n = d.servers.nodes.find((x) => x.node === sel.key);
    if (!n) return body("보안 통계", "기간 안에 없는 노드입니다", "");
    const clauses = d.servers.clauses.filter((c) => c.nodes.includes(n.node));
    body("서버 등급 변화", n.node, `${kvTable([["마지막 등급", n.level || "판정 없음"], ["기간 안 변화", n.trend],
        ["점검", n.grades.map((g) => `${stamp(g.at)} ${g.level}`).join("\n") || "없음"], ["설정이 바뀐 수집", `${n.changed} / ${n.collected}`]])}
      ${clauses.length ? `<div class="sec"><h4>${icon("warn", "sm")}걸린 조항</h4><div class="box pre">${esc(clauses.map((c) => `${chipLabel(c.source)} — ${c.items.filter((i) => i.startsWith(n.node + " ")).map((i) => i.slice(n.node.length + 3)).join(", ")}`).join("\n"))}</div></div>` : ""}
      <div class="sec"><button class="rerun" id="stat-go">${icon("server", "sm")}노드 탭에서 보기</button></div>`);
    $("stat-go").addEventListener("click", () => { setView("policies"); setMainTab("nodes"); pickNode(n.node); });
    return;
  }
  if (sel.kind === "trust") {
    const p = (d.trust || []).find((x) => x.key === sel.key);
    if (!p) return body("사용자 신뢰 수치", "기간 안에 없는 사용자입니다", "");
    const ex = S.explain && S.explain.key === p.key && S.explain.period === S.period ? S.explain : null;
    body("사용자 신뢰 수치", `${p.department ? p.department + " " : ""}${p.name}`, `${kvTable([
        ["신뢰 수치", `${p.score}점 · ${p.band}`], ["계정", p.login_id || "계정 미연결 — 계정 관리에서 로그 사용자 ID 를 적으면 이어집니다"],
        ["로그 사용자 ID", p.log_id || "없음"], ["로그 감시", `위험 ${p.counts["로그 위험"]} · 주의 ${p.counts["로그 주의"]} · 정상 ${p.counts["로그 정상"]}`],
        ["권한 신청", `${p.counts["신청"]}건 · AI 위험 ${p.counts["신청 위험"]} · 반려 ${p.counts["반려"]} · 회수 ${p.counts["회수"]}`]])}
      <div class="sec"><h4>${icon("warn", "sm")}감점 내역 ${p.deductions.length}</h4>${p.deductions.length
        ? `<div class="box pre">${esc(p.deductions.map((x) => `-${x.points}  ${stamp(x.at)}  ${x.what}${x.weight < 1 ? ` (오래된 기록 ×${x.weight})` : ""}`).join("\n"))}</div>`
        : `<p class="note">감점할 기록이 없습니다.</p>`}</div>
      <div class="sec"><h4>${icon("chat", "sm")}AI 근거 요약</h4>${ex
        ? `<div class="box${ex.failed ? " fail" : ""}">${ex.loading ? `요약 중… (수십 초)` : esc(ex.explanation)}</div>`
        : `<button class="rerun" id="trust-explain">${icon("chat", "sm")}근거 요약 받기</button>`}
        <p class="note">점수는 규칙이 냈고, 모델은 위 기록을 요약만 합니다. 요약은 저장하지 않습니다.</p></div>
      <div class="sec">${p.log_subject ? `<button class="rerun" id="stat-go">${icon("search", "sm")}이 사용자의 로그 조회</button>` : ""}</div>`);
    const go = $("stat-go");
    if (go) go.addEventListener("click", () => { setView("events"); openLogs({ user: p.log_subject, period: S.period }); });
    const btn = $("trust-explain");
    if (btn) btn.addEventListener("click", async () => {
      S.explain = { key: p.key, period: S.period, loading: true };
      renderPanel();
      try { Object.assign(S.explain, await send("/api/user-stats/explain", { key: p.key, period: S.period }), { loading: false }); }
      catch (e) { Object.assign(S.explain, { loading: false, failed: true, explanation: `요약 실패: ${e.message}` }); }
      if (state.stats.selected && state.stats.selected.key === p.key) renderPanel();
    });
    return;
  }
  if (sel.kind === "module") {
    const m = d.servers.modules.find((x) => x.module === sel.key);
    if (!m) return body("보안 통계", "기간 안에 없는 모듈입니다", "");
    body("노드 위협 데이터", m.module, `${kvTable([["위험", `${m["위험"]}건`], ["주의", `${m["주의"]}건`], ["걸린 서버", m.nodes.join(", ")]])}
      <div class="sec"><h4>${icon("warn", "sm")}항목 — 노드 · 지금 값</h4><div class="box pre">${esc(m.items.join("\n"))}</div></div>`);
    return;
  }
  if (sel.kind === "clause") {
    const c = d.servers.clauses.find((x) => x.source === sel.key);
    if (!c) return body("보안 통계", "기간 안에 없는 조항입니다", "");
    body("걸린 조항", chipLabel(c.source), `<div class="sec"><h4>${icon("server", "sm")}걸린 서버 ${c.nodes.length} · 항목</h4><div class="box pre">${esc(c.items.join("\n"))}</div></div>
      <div class="sec"><h4>${icon("book", "sm")}기준 문서 원문</h4><div class="clause">${esc(clauseText(c.source))}</div></div>`);
    return;
  }
  if (sel.kind === "mismatch") {
    const m = d.requests.mismatches.find((x) => x.request_no === sel.key);
    if (!m) return body("보안 통계", "기간 안에 없는 신청입니다", "");
    body("AI와 결재가 엇갈린 신청", m.request_no, `${kvTable([["신청자", m.requester], ["권한", m.access], ["AI 판정", m.ai], ["결재", m.outcome], ["신청 시각", stamp(m.submitted_at)]])}
      <p class="note">AI가 위험으로 봤는데 승인됐거나, 정상으로 봤는데 반려된 신청입니다. 결재 의견을 보고 기준 문서 · 권한 목록 설명을 보완할지 판단하세요.</p>
      <div class="sec"><button class="rerun" id="stat-go">${icon("lock", "sm")}결재함에서 보기</button></div>`);
    $("stat-go").addEventListener("click", () => { state.stageFilter = "all"; $("stage-filter").value = "all"; state.selected = `req:${m.request_no}`; setView("requests"); setMainTab("queue"); renderRows(); renderPanel(); });
    return;
  }
  const g = (sel.kind === "dept" ? d.requests.departments : d.requests.accesses).find((x) => x.name === sel.key);
  if (!g) return body("보안 통계", "기간 안에 없는 항목입니다", "");
  const n = g["신청"] - (g.ai["판정 없음"] || 0);
  body(sel.kind === "dept" ? "부서별 권한 신청" : "권한별 신청", g.name, kvTable([["신청", `${g["신청"]}건`], ["AI 판정", levelsText(g.ai)],
    ["정책 위반 소지", `${pct((g.ai["위험"] || 0) + (g.ai["주의"] || 0), n)} (주의 · 위험 / 판정 ${n}건)`], ["위험 비율", pct(g.ai["위험"] || 0, n)],
    ["결재 결과", Object.entries(g.outcome).map(([k, n]) => `${k} ${n}`).join(" · ")]]));
}

function openLogs(cond) {
  Object.assign(state.logs, { user: "", solution: "", how: "", page: 1 }, cond);
  setMainTab("logs");
  loadLogs();
}

const logAttrs = (e) => Object.entries(e.attributes || {}).map(([k, v]) => `${k}=${v}`).join(" · ");

function renderLogs() {
  const L = state.logs, d = L.data;
  $("log-periods").innerHTML = Object.entries(PERIOD_LABEL).map(([k, label]) =>
    `<button data-period="${k}" aria-pressed="${k === L.period}">${label}</button>`).join("");
  LOG_FILTERS.forEach(([k, id, all, opt]) => {
    // 고른 값이 로그에 없더라도(판정에서 넘어온 사용자 등) 칸에서 사라지지 않게 둡니다.
    const values = [...((d && d.options[opt]) || [])];
    if (L[k] && !values.includes(L[k])) values.unshift(L[k]);
    $(id).innerHTML = `<option value="">${all}</option>` + values.map((v) => `<option${v === L[k] ? " selected" : ""}>${esc(v)}</option>`).join("");
  });
  $("log-count").textContent = L.loading ? "불러오는 중…" : d ? `${d.total.toLocaleString()}건` : "";
  const rows = $("log-rows");
  if (L.error) rows.innerHTML = `<tr><td colspan="6" class="empty">로그를 불러오지 못했습니다: ${esc(L.error)}</td></tr>`;
  else if (!d) rows.innerHTML = `<tr><td colspan="6" class="empty">불러오는 중…</td></tr>`;
  else if (!d.events.length) rows.innerHTML = `<tr><td colspan="6" class="empty">${esc(PERIOD_LABEL[d.period])} 안에 조건에 맞는 로그가 없습니다.</td></tr>`;
  else rows.innerHTML = d.events.map((e, n) => `<tr data-n="${n}" tabindex="0" aria-current="${n === L.selected}">
      <td class="when">${esc(stamp(e.occurred_at))}</td><td class="lwho">${esc(e.user)}</td><td class="col-sol">${esc(e.solution)}</td>
      <td class="col-where">${esc(e.where)}</td><td class="col-how">${esc(e.how)}</td><td class="attrs">${esc(logAttrs(e))}</td></tr>`).join("");
  const pages = d ? Math.max(1, Math.ceil(d.total / d.page_size)) : 1;
  $("log-pager").innerHTML = d && pages > 1
    ? `<button class="rerun" data-page="${L.page - 1}" ${L.page <= 1 ? "disabled" : ""}>이전</button><span>${L.page} / ${pages}쪽</span>
       <button class="rerun" data-page="${L.page + 1}" ${L.page >= pages ? "disabled" : ""}>다음</button>`
    : "";
}

$("log-periods").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-period]");

  Object.assign(state.logs, { period: b.dataset.period, page: 1 });

});
LOG_FILTERS.forEach(([k, id]) => $(id).addEventListener("change", (e) => {

$("log-pager").addEventListener("click", (e) => {
