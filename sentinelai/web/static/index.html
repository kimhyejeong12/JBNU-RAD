// 패널: 고른 줄이 있으면 그 로그의 원본, 없으면 지금 조건의 집계. 숫자는 모두 코어가 센 값입니다.
function renderLogsPanel() {
  const L = state.logs, d = L.data, e = d && L.selected !== null ? d.events[L.selected] : null;
  const panel = $("panel");
  if (e) {
    const fields = [["시각", stamp(e.occurred_at)], ["사용자", e.user], ["사용자 ID", e.user_id], ["솔루션", e.solution],
      ["위치", e.where], ["행위", e.how], ["IP", e.source_ip], ...Object.entries(e.attributes || {})].filter(([, v]) => v);
    panel.innerHTML = `<div class="panel-head"><h3>로그 원본</h3>${CLOSE_BTN}</div>
      <div class="panel-body">
        <p class="subject">${esc(e.user)}</p>
        <div class="meta">${esc(stamp(e.occurred_at))} · ${esc(e.solution)}</div>
        <div class="sec"><h4>${icon("list", "sm")}내용</h4>${kvTable(fields)}</div>
        <div class="sec"><h4>${icon("file", "sm")}내보낸 행 그대로</h4>${kvTable(Object.entries(e.raw || {}))}</div>
        <button class="rerun" id="log-back">${icon("activity", "sm")}집계로 돌아가기</button>
      </div>`;
    $("log-back").addEventListener("click", closePanel);
    return;
  }
  const f = d && d.facts;
  const cond = d ? [PERIOD_LABEL[d.period], ...Object.values(d.criteria)].join(" · ") : "";
  const list = (obj, limit) => {
    const rows = Object.entries(obj || {});
    return rows.length ? kvTable(rows.slice(0, limit).map(([k, v]) => [k, `${v}건`])) + (rows.length > limit ? `<p class="note">상위 ${limit}개만 표시합니다.</p>` : "") : `<p class="note">없음</p>`;
  };
  panel.innerHTML = `<div class="panel-head"><h3>조회 집계</h3>${CLOSE_BTN}</div>
    <div class="panel-body">${!f ? `<div class="empty">${L.error ? esc(L.error) : "불러오는 중…"}</div>` : `
      <p class="subject">${esc(cond)}</p>
      <div class="meta">${esc(stamp(d.since) || "처음")} ~ ${esc(stamp(d.until))}</div>
      <div class="sec"><h4>${icon("activity", "sm")}합계</h4>${kvTable([["해당 로그", `${f.count.toLocaleString()}건`],
        ...(f.count ? [["처음 · 마지막", `${stamp(f.first)} ~ ${stamp(f.last)}`]] : []),
        ...Object.entries(f.attribute_totals).map(([k, v]) => [`${k} 합계`, String(v)])])}</div>
      <div class="sec"><h4>${icon("users", "sm")}사용자별</h4>${list(f.by_user, 20)}</div>
      <div class="sec"><h4>${icon("list", "sm")}날짜별 (많은 순)</h4>${list(f.by_day, 14)}</div>
      <p class="note">숫자는 코어가 로그에서 직접 센 값입니다. 목록에서 줄을 고르면 그 로그의 원본을 봅니다.</p>`}
    </div>`;
}

/* ── 보기 전환 · 필터 · 검색 ─────────────── */
function setMainTab(tab) {
  const panelChanges = state.mainTab !== tab;
  // 탭을 떠나면 열어 둔 인용 조항도 닫습니다. 패널은 그 탭의 것입니다.
  if (panelChanges && state.askSource) {
    state.askSource = null;
    renderAsk();
  }
  state.mainTab = tab;
  document.querySelectorAll(".main-tab").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("view-queue").hidden = tab !== "queue";
  $("view-ask").hidden = tab !== "ask";
  $("view-logs").hidden = tab !== "logs";
  $("view-nodes").hidden = tab !== "nodes";
  $("view-stats").hidden = !isStatTab(tab);
  renderFooter();
  document.querySelector(".workspace").dataset.tab = tab;
  syncCite();
  if (panelChanges) renderPanel();
  if (tab === "ask") $("ask-input").focus();
  if (tab === "logs" && !state.logs.data && !state.logs.loading) loadLogs();
  if (tab === "nodes") loadNodes();
  if (isStatTab(tab)) loadStats();
}

document.querySelectorAll(".main-tab").forEach((b) => b.addEventListener("click", () => setMainTab(b.dataset.tab)));

function setView(view) {
  const changed = state.view !== view;
  state.view = view;
  const meta = VIEWS[view];
  document.querySelectorAll(".main-tab").forEach((b) => { b.hidden = !meta.tabs.includes(b.dataset.tab); });
  // 탭이 하나뿐이면 탭 줄 대신 대기열 제목으로 지금 메뉴를 알립니다.
  document.querySelector(".main-tabs").hidden = meta.tabs.length < 2;
  $("queue-title").textContent = view === "requests" ? `${meta.label} — ${state.me.role === "manager" ? "1차" : "최종"} 결재함` : meta.title;
  $("q").placeholder = meta.search;
  $("req-form").hidden = view !== "mine";
  $("stage-filter").hidden = view !== "requests";
  $("add-user").hidden = view !== "users";
  $("add-access").hidden = view !== "access";
  if (view === "mine") renderAccessSelect();
  if (!meta.tabs.includes(state.mainTab)) setMainTab(meta.tabs[0]);
  if (changed) { state.filter = "전체"; state.panelMsg = ""; }
  // 패널도 메뉴를 따릅니다. 다른 메뉴의 항목이 남아 있으면 이 메뉴의 첫 항목으로 바꿉니다.
  const current = queue().find((i) => i.key === state.selected);
  if (!current || !inView(current)) {
    const first = queue().find(inView);
    state.selected = first ? first.key : null;
  }
  document.querySelectorAll("#seg button").forEach((b) => b.setAttribute("aria-selected", b.dataset.view === view));
  document.querySelectorAll(".nav[data-view]").forEach((b) => b.setAttribute("aria-current", b.dataset.view === view));
  renderStats();   // 요약 카드 숫자가 보기 범위를 따릅니다
  renderRun();     // 실행 버튼이 보기 범위의 분석을 돌립니다
  renderRows();
  renderPanel();
  renderFooter();
  if (changed) {
    // 질의 탭도 메뉴를 따릅니다 (정책 질의 ↔ 로그 질의). 열어 둔 근거는 다른 질의의 것이라 닫습니다.
    state.askSource = null;
    renderAskExamples();
    renderAsk();
    syncCite();
  }
}

// 메뉴는 로그인한 역할에 따라 만듭니다. 넓은 화면은 사이드바, 좁은 화면은 탭 줄 위 세그먼트.
function buildNav() {
  const views = roleViews();
  $("nav-views").innerHTML = views.map((v) =>
    `<button class="nav" data-view="${v}" aria-label="${esc(VIEWS[v].label)}" data-tip-pos="right" data-tip="${esc(VIEWS[v].tip)}">${icon(VIEWS[v].icon)}</button>`).join("");
  $("seg").innerHTML = views.map((v) => `<button role="tab" data-view="${v}">${esc(VIEWS[v].label)} <span data-count="${v}"></span></button>`).join("");
  $("seg").hidden = views.length < 2;
  $("nav-docs").hidden = state.me.role === "user";
  document.querySelectorAll("#seg button, .nav[data-view]").forEach((b) => b.addEventListener("click", () => {
    setMainTab("queue");
    setView(b.dataset.view);
  }));
}

$("stage-filter").addEventListener("change", (e) => {
  state.stageFilter = e.target.value;
  setView(state.view);
});
$("add-access").addEventListener("click", () => {
  state.selected = null;
  state.panelMsg = "";
  renderRows();
  renderPanel();
  openDrawer();
});
$("req-access").addEventListener("change", renderAccessNote);
$("add-user").addEventListener("click", () => {
  state.selected = null;
  state.panelMsg = "";
  renderRows();
  renderPanel();
  openDrawer();
});

$("q").addEventListener("input", (e) => { state.query = e.target.value; renderRows(); });

$("bell").addEventListener("click", (e) => { e.stopPropagation(); $("alert-pop").classList.toggle("show"); });
document.addEventListener("click", (e) => {
  if (!$("alert-pop").contains(e.target)) $("alert-pop").classList.remove("show");
});

$("nav-docs").addEventListener("click", () => {
  $("docs-body").innerHTML = state.regulations.length
    ? state.regulations.map((d) => `<div class="doc"><h4>${esc(d.name)}</h4><pre>${esc(d.content.trim())}</pre></div>`).join("")
    : `<p class="note">기준 문서를 불러오지 못했습니다.</p>`;
  $("docs-modal").classList.add("show");
});
$("docs-close").addEventListener("click", () => $("docs-modal").classList.remove("show"));
$("docs-modal").addEventListener("click", (e) => { if (e.target === $("docs-modal")) $("docs-modal").classList.remove("show"); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  $("docs-modal").classList.remove("show");
  closePanel();
});

/* ── 작은 화면 서랍 — 1150px 미만에서만 패널을 오른쪽 서랍으로 띄웁니다 ── */
const CLOSE_BTN = '<button class="drawer-close" aria-label="닫기">×</button>';
const narrow = matchMedia("(max-width: 1150px)");

function openDrawer() {
  if (!narrow.matches) return;
  $("panel").classList.add("open");
  $("drawer-back").classList.add("show");
  document.body.classList.add("drawer-open");
}

function closeDrawer() {
  $("panel").classList.remove("open");
  $("drawer-back").classList.remove("show");
  document.body.classList.remove("drawer-open");
}

// 정책 질의 탭에서 닫으면 넓은 화면에서도 인용 조항 패널을 접습니다.
function closePanel() {
  closeDrawer();
  if (state.mainTab === "nodes" && (state.nodes.selected || state.nodes.adding)) {
    Object.assign(state.nodes, { selected: null, detail: null, adding: false });
    renderNodes();
    renderPanel();
  }
  if (state.mainTab === "logs" && state.logs.selected !== null) {
    state.logs.selected = null;
    renderLogs();
    renderPanel();
  }
  if (state.mainTab === "ask" && state.askSource) {
    state.askSource = null;
    renderAsk();
    syncCite();
  }
}

$("drawer-back").addEventListener("click", closePanel);
// 패널 내용은 다시 그려지므로 닫기 버튼은 패널에 위임합니다.
$("panel").addEventListener("click", (e) => { if (e.target.closest(".drawer-close")) closePanel(); });
// 넓은 화면으로 바뀌면 서랍 상태를 풀어 배경 막이 남지 않게 합니다.
narrow.addEventListener("change", (e) => { if (!e.matches) closeDrawer(); });

function renderFooter() {
  // 계산 시각 · 분석 경고는 정책 관리 · 로그 감시 결과의 것이라 그 메뉴에서만 보입니다.
  $("foot").hidden = state.mainTab !== "queue" || !RESULT_VIEWS.has(state.view);
  if ($("foot").hidden) return;
  const r = state.results, s = r.summary;
  // 판정 실패 · 읽지 못한 행 · 작업 실패는 문제가 있을 때만 알립니다.
  const warns = [];
  if (s.failed) warns.push(`판정 실패 ${s.failed}건 — 해당 건은 '주의'로 기록되었습니다. 수동 검토가 필요합니다`);
  Object.entries(r.sections || {}).forEach(([name, sec]) => {
    if (sec && sec.load_issues.length) warns.push(`${sec.source} 읽기 문제 ${sec.load_issues.length}건 — ${sec.load_issues[0]}`);
  });
  Object.entries((state.jobs && state.jobs.last) || {}).forEach(([kind, last]) => {
    if (last.error) warns.push(`${state.jobs.kinds[kind]} 실패 — ${last.error}`);
  });
  const at = r.generated_at ? `계산 시각 ${esc(stamp(r.generated_at))}` : "아직 분석하지 않았습니다";
  $("foot").innerHTML = at + warns.map((w) => ` · <span class="warn">${esc(w)}</span>`).join("");
}

function renderAll() {
  renderTop(); renderStats(); renderRun(); renderRows(); renderAskExamples(); renderAsk(); renderLogs(); renderPanel(); renderFooter();
}

/* ── 로그인 · 비밀번호 · 로그아웃 ───────────── */
function showLogin() {
  $("gate").hidden = false;
  $("login-form").hidden = false;
  $("pw-form").hidden = true;
  $("login-form").login_id.focus();
}

function showPassword(forced) {
  $("gate").hidden = false;
  $("login-form").hidden = true;
  $("pw-form").hidden = false;
  $("pw-form").reset();
  $("pw-msg").textContent = "";
  $("pw-title").textContent = forced ? "처음 로그인했습니다" : "비밀번호 변경";
  $("pw-note").textContent = forced ? "계속하려면 비밀번호를 바꾸세요. 루트가 준 임시 비밀번호는 더 쓸 수 없습니다." : "바꾸면 다른 곳에 로그인된 세션은 끊깁니다.";
  $("pw-cancel").hidden = forced;
  $("pw-form").current.focus();
}

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-msg").textContent = "";
  try {
    await send("/api/auth/login", { login_id: e.target.login_id.value, password: e.target.password.value });
    location.reload();
  } catch (err) {
    $("login-msg").textContent = err.message;
    e.target.password.value = "";
  }
});

$("pw-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.new.value !== f.confirm.value) { $("pw-msg").textContent = "새 비밀번호 두 칸이 다릅니다"; return; }
  try {
    await send("/api/auth/password", { current: f.current.value, new: f.new.value });
    location.reload();
  } catch (err) { $("pw-msg").textContent = err.message; }
});
$("pw-cancel").addEventListener("click", () => { $("gate").hidden = true; });
$("btn-password").addEventListener("click", () => showPassword(false));
$("btn-logout").addEventListener("click", async () => {
  try { await send("/api/auth/logout"); } finally { location.reload(); }
});

$("new-request").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    const made = await send("/api/requests", Object.fromEntries(new FormData(f)));
    f.reset();
    renderAccessNote();
    $("req-form-msg").className = "form-msg ok";
    $("req-form-msg").textContent = `${made.request_no} 신청했습니다. 보안 운영자의 1차 결재를 기다립니다.`;
    state.selected = `mine:${made.request_no}`;
    await refreshRequests();
  } catch (err) {
    $("req-form-msg").className = "form-msg";
    $("req-form-msg").textContent = err.message;
  }
});

/* ── 툴팁 — data-tip="제목|설명". 다시 그려도 동작하도록 document 에 위임합니다 ── */
const tip = document.createElement("div");
tip.className = "tip";
tip.setAttribute("role", "tooltip");
document.body.appendChild(tip);
let tipTarget = null, tipTimer = null;

function placeTip(el) {
  const r = el.getBoundingClientRect();
  const pos = el.dataset.tipPos || "bottom";
  const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 8;
  let x, y;
  if (pos === "right") {
    x = r.right + gap + 2; y = r.top + r.height / 2 - th / 2;
  } else {
    x = r.left + r.width / 2 - tw / 2; y = r.bottom + gap;
    if (y + th > innerHeight - gap) y = r.top - th - gap;   // 아래 공간이 없으면 위로
  }
  tip.style.left = Math.max(gap, Math.min(x, innerWidth - tw - gap)) + "px";
  tip.style.top = Math.max(gap, Math.min(y, innerHeight - th - gap)) + "px";
  tip.dataset.pos = pos;
}

function showTip(el) {
  const [title, desc] = String(el.dataset.tip || "").split("|");
  if (!title) return;
  tipTarget = el;
  tip.innerHTML = desc ? `<b>${esc(title)}</b><span>${esc(desc)}</span>` : `<span style="color:#fff;margin:0">${esc(title)}</span>`;
  tip.classList.remove("show");
  placeTip(el);
  requestAnimationFrame(() => tip.classList.add("show"));
}

function hideTip() {
  clearTimeout(tipTimer);
  tipTarget = null;
  tip.classList.remove("show");
}

document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]");
  if (el === tipTarget) return;
  clearTimeout(tipTimer);
  if (!el) { hideTip(); return; }
  // 사이드바 · 상단 바는 바로, 나머지는 목록을 훑을 때 깜빡이지 않게 살짝 늦게
  const instant = el.closest(".sidebar, .topbar");
  tipTimer = setTimeout(() => showTip(el), instant ? 0 : 220);
});
document.addEventListener("focusin", (e) => {
  const el = e.target.closest("[data-tip]");
  if (el) showTip(el); else hideTip();
});
document.addEventListener("focusout", hideTip);
document.addEventListener("scroll", hideTip, true);
document.addEventListener("click", hideTip, true);

paintIcons();

async function boot() {
  try {
    state.me = await getJSON("/api/auth/me");
  } catch (e) {
    return;   // 401 이면 getJSON 이 로그인 화면을 띄웠습니다
  }
  if (state.me.must_change_password) { showPassword(true); return; }
  $("who").hidden = false;
  $("who-name").textContent = `${state.me.display_name} · ${ROLE_LABEL[state.me.role]}${state.me.is_root ? " (루트)" : ""}`;
  // 메뉴가 하나뿐인 일반 사용자는 사이드바 없이 신청 화면만 씁니다.
  document.body.classList.toggle("solo", roleViews().length < 2);
  buildNav();
  await Promise.all([loadData(), loadAsks()]);
  const views = roleViews();
  setView(views[0]);
  renderAll();
  watchJobs();   // 다른 창에서 시작한 작업이 돌고 있으면 이어서 지켜봅니다
}

boot().catch((e) => {
  document.querySelector(".workspace").innerHTML =
    `<div class="card empty" style="grid-column:1/-1">서버에서 화면 데이터를 받지 못했습니다: ${esc(e.message)}</div>`;
});
</script>
</body>
